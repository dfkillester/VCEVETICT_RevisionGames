<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>VCE VET ICT Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen studio app. Title bar and team scoreboard across the top, a centred stage that swaps slides, all controls docked along the bottom. Single mid-blue studio look for projectors; game boards keep their TV colours. */
:root{
  color-scheme:dark;
  --studio:#24335E; --surface:#2D3E70; --navy:#182036; --panel:#34477D; --panel-2:#3F548F; --line:#566BA8;
  --ink:#F4F6FC; --muted:#C3CCE4; --gold:#FFC530; --gold-ink:#1A1400; --gold-text:#FFC530;
  --blue:#2FB0EC; --jblue:#1F4FC4; --jlight:#8FB2FF; --royal:#2453C9; --royal-2:#173A96; --green:#556D31; --ok:#4E9A33; --bad:#E0574B; --white:#FFFFFF;
  --u310:#3DB3EA; --u305:#F2B632; --u309:#93B562; --u312:#A68BEA; --u313:#EE7A63;
  --f-show:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--studio);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}

/* Header */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 20px;background:var(--navy);color:var(--white)}
.bar .showname b{color:var(--gold)}
.bar .crumb{color:#C3CBDE}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 20px;background:var(--surface);border-top:1px solid var(--line)}
.controls .grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.logo{background:var(--white);border-radius:8px;padding:5px 8px;height:40px;display:flex;align-items:center}
.logo img{height:100%;width:auto;max-width:none}
.showname{font-family:var(--f-show);font-weight:900;font-size:1.55rem;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.showname b{color:var(--gold-text)}
.crumb{color:var(--muted);font-size:.92rem;min-width:0}
.sp{flex:1}
.nav{display:flex;align-items:center;gap:6px}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.ib:hover{border-color:var(--gold-text)}
.ib.end{border-color:var(--gold-text);color:var(--gold-text)}
.ib.end:hover{background:var(--gold);color:var(--gold-ink)}
.ib[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-text)}
.count{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);min-width:56px;text-align:center;font-variant-numeric:tabular-nums}

/* Stage */
.stage{overflow:auto;padding-block:clamp(16px,3vh,32px);padding-inline:clamp(16px,3vw,36px);position:relative}
.slide{max-width:1280px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--panel-2);color:var(--ink)}
.btn:hover{filter:brightness(1.15)}
.btn.go{background:var(--gold);color:var(--gold-ink)}
.btn.ok{background:var(--ok);color:var(--white)}
.btn.no{background:var(--bad);color:var(--white)}
.btn.ghost{background:none;border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kbd{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.upill{font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1px solid var(--c);color:var(--c)}

/* Scoreboard */
.score{display:flex;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 4px 12px rgba(24,32,54,.06);overflow-x:auto}
.team{flex:1 1 0;min-width:140px;box-shadow:0 2px 0 var(--line);display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;background:var(--panel);border:2px solid transparent;border-radius:10px;padding:6px 10px}
.team.cur{border-color:var(--gold-text);background:var(--panel-2)}
.turn{grid-row:1 / 3;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;font-size:.7rem;color:var(--gold-text);display:grid;place-items:center;padding:0}
.team.cur .turn{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-text)}
.tname{grid-column:2;min-width:0;width:100%;background:none;border:0;border-bottom:1px dashed transparent;color:var(--ink);font:600 .9rem var(--f-body);padding:1px 0}
.tname:hover,.tname:focus{border-bottom-color:var(--muted);outline:none}
.pts{grid-column:2;font-family:var(--f-show);font-weight:900;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.pts.bump{animation:bump .5s}
@keyframes bump{40%{color:var(--gold-text);transform:scale(1.15)}}
.adj{grid-column:3;grid-row:1 / 3;display:grid;gap:3px}
.adj button{width:26px;height:22px;border:1px solid var(--line);background:none;border-radius:5px;font-size:.9rem;line-height:1;padding:0}
.adj button:hover{border-color:var(--gold-text)}

/* Toast + splash */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-weight:800;padding:10px 20px;border-radius:999px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4);pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(16,22,40,.78);z-index:40;display:grid;place-items:center;padding:20px}
.modal-box{width:min(960px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,40px);display:grid;gap:20px}
.bigx{position:fixed;inset:0;display:grid;place-items:center;z-index:60;pointer-events:none}
.bigx div{font-family:var(--f-show);font-weight:900;color:var(--bad);font-size:min(40vw,320px);line-height:1;text-shadow:0 0 40px rgba(217,72,60,.6);animation:xin .9s forwards}
@keyframes xin{0%{transform:scale(.4);opacity:0}20%{transform:scale(1.05);opacity:1}80%{opacity:1}100%{opacity:0}}

/* Welcome */
.welcome{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
.host{background:radial-gradient(circle at 50% 25%,var(--panel-2),var(--surface) 70%);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;justify-items:center;text-align:center;gap:14px}
.host img{width:min(220px,60vw);border-radius:50%;border:5px solid var(--gold);box-shadow:0 0 0 10px rgba(255,197,48,.12)}
.marquee{font-family:var(--f-show);font-weight:900;text-transform:uppercase;line-height:.92;font-size:clamp(2.6rem,6vw,4.8rem);letter-spacing:.01em}
.marquee b{color:var(--gold-text);display:block}
.runsheet{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.rs{box-shadow:0 2px 0 var(--line);display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);padding:12px 16px;text-align:left;width:100%}
.rs:hover{border-color:var(--gold-text);border-left-color:var(--c)}
.rs .no{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.gic{width:28px;height:28px}
.gic.big{width:clamp(64px,10vw,104px);height:auto;color:var(--c)}
.ruleshead{display:flex;align-items:center;gap:14px}
.ruleshead .gic{width:52px;height:52px;color:var(--c);flex:none}
.rs h3{font-family:var(--f-show);font-weight:800;font-size:1.45rem;text-transform:uppercase;letter-spacing:.02em}
.rs small{color:var(--muted);font-size:.9rem}
.rs .min{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.setup{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border-radius:var(--r);padding:14px 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 13px;font-weight:700}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.tip{color:var(--muted);font-size:.92rem}

/* Title + rules slides */
.title-slide{flex:1;display:grid;place-items:center;text-align:center;border-radius:20px;padding:clamp(24px,6vw,80px) 20px;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--c) 30%,transparent),transparent 60%),radial-gradient(ellipse at 50% 120%,color-mix(in srgb,var(--gold) 18%,transparent),transparent 55%),var(--surface);border:1px solid var(--line)}
.title-slide .marquee{font-size:clamp(3rem,9vw,7.5rem)}
.title-slide .gameno{font-family:var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-text);font-size:.95rem}
.title-slide .meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.rules{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:24px;align-items:start}
.rules h2{font-family:var(--f-show);font-weight:900;font-size:clamp(2.2rem,5vw,3.6rem);text-transform:uppercase;line-height:1}
.rules ol{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:r}
.rules ol li{counter-increment:r;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;font-size:clamp(1.05rem,1.8vw,1.3rem);background:var(--panel);border-radius:var(--r);padding:12px 16px}
.rules ol li::before{content:counter(r);font-family:var(--f-show);font-weight:900;font-size:1.8rem;line-height:1;color:var(--gold-text)}
.ctl{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;font-size:.95rem}
.ctl h3{font-size:.8rem;font-family:var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ctl ul{margin:0;padding-left:1.1em;display:grid;gap:6px}
.nextcue{margin-top:auto;display:flex;justify-content:flex-end}

/* Millionaire */
.mill{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:24px;align-items:start}
.hot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted)}
.hot b{color:var(--gold-text)}
.mq{position:relative;background:linear-gradient(180deg,var(--royal),var(--royal-2));clip-path:polygon(2.5% 0,97.5% 0,100% 50%,97.5% 100%,2.5% 100%,0 50%);padding:clamp(18px,3vw,30px) clamp(28px,5vw,60px);font-size:clamp(1.15rem,2.3vw,1.75rem);font-weight:600;color:var(--white);text-align:center;min-height:130px;display:grid;place-items:center;white-space:pre-line}
.mopts{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.mopt{border:0;text-align:left;color:var(--white);background:linear-gradient(180deg,var(--royal),var(--royal-2));clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);padding:16px 40px;font-size:clamp(1rem,1.8vw,1.3rem);display:flex;gap:12px;align-items:center;min-height:64px}
.mopt b{color:var(--gold);font-family:var(--f-show);font-size:1.4em;line-height:1}
.mopt:hover:not(:disabled){filter:brightness(1.25)}
.mopt.sel{background:var(--gold);color:var(--gold-ink)}
.mopt.sel b{color:var(--gold-ink)}
.mopt.lock{animation:pulse 1s infinite alternate}
@keyframes pulse{to{filter:brightness(1.2)}}
.mopt.right{background:var(--ok);color:var(--white);animation:none}
.mopt.right b,.mopt.wrong b{color:var(--white)}
.mopt.wrong{background:var(--bad);color:var(--white);animation:none}
.mopt.gone{visibility:hidden}
.mexp{background:var(--panel);border-left:4px solid var(--gold);border-radius:8px;padding:12px 16px;font-size:1.05rem}
.life{display:flex;gap:10px;flex-wrap:wrap}
.lb{border:2px solid var(--blue);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700}
.lb:disabled{border-color:var(--line);text-decoration:line-through}
.ladder{list-style:none;margin:0;padding:10px;display:flex;flex-direction:column-reverse;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ladder li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:4px 10px;border-radius:6px;font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ladder li.done{color:var(--gold-text)}
.ladder li.now{background:var(--gold);color:var(--gold-ink);font-weight:700}
.ladder li.big{color:var(--ink)}
.ladder li span:last-child{opacity:.7;font-size:.75rem}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end;height:240px}
.barcol{display:grid;grid-template-rows:auto 1fr auto auto;gap:6px;height:100%;text-align:center}
.barcol .bt{display:flex;align-items:flex-end;justify-content:center;height:100%;background:var(--panel);border-radius:8px;overflow:hidden}
.barcol .bf{width:100%;background:var(--blue);transition:height .3s}
.barcol b{font-family:var(--f-show);font-size:1.6rem}
.clock{font-family:var(--f-show);font-weight:900;font-size:clamp(5rem,16vw,10rem);color:var(--gold-text);text-align:center;line-height:1;font-variant-numeric:tabular-nums}

/* Feud */
.feud{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;align-items:start}
.fq{background:var(--panel-2);border:3px solid var(--gold);border-radius:16px;padding:18px 24px;text-align:center;font-family:var(--f-show);font-weight:800;font-size:clamp(1.5rem,3vw,2.4rem);text-transform:uppercase;line-height:1.05}
.fboard{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(var(--rows),auto);gap:10px;background:#102A75;border:6px solid var(--gold);border-radius:20px;padding:14px;margin-top:14px}
.ftile{perspective:800px;height:clamp(56px,8vh,76px);border:0;padding:0;background:none}
.ftile .in{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}
.ftile.open .in{transform:rotateX(180deg)}
.ftile .f,.ftile .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;display:flex;align-items:center;justify-content:center;border:2px solid #4D74D6}
.ftile .f{background:linear-gradient(180deg,#2B55C7,#1A3A9A)}
.ftile .f span{width:46px;height:46px;border-radius:50%;background:#102A75;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--f-show);font-weight:900;font-size:1.6rem;color:var(--white)}
.ftile .b{transform:rotateX(180deg);background:linear-gradient(180deg,#2B55C7,#1A3A9A);justify-content:space-between;padding:0 6px 0 16px;font-weight:700;font-size:clamp(.95rem,1.6vw,1.25rem);color:var(--white);text-align:left;gap:8px}
.ftile .b em{font-style:normal;background:#102A75;border-radius:6px;padding:4px 10px;font-family:var(--f-show);font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums}
.ftile.empty{visibility:hidden}
.fside{display:grid;gap:12px}
.fguess{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:14px}
.fguess input{min-width:0;font:600 1.2rem var(--f-body);color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px 14px}
.fguess input:focus{border-color:var(--gold-text);outline:none}
.fmsg{margin-top:8px;padding:8px 14px;border-radius:8px;background:var(--panel);color:var(--muted);min-height:40px}
.fmsg.good{background:color-mix(in srgb,var(--ok) 25%,var(--panel));color:var(--ink)}
.fmsg.bad{background:color-mix(in srgb,var(--bad) 25%,var(--panel));color:var(--ink)}
@media (max-width:560px){.fguess{grid-template-columns:minmax(0,1fr) auto}.fguess label{grid-column:1 / -1}}
.pot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.pot b{display:block;font-family:var(--f-show);font-weight:900;font-size:3.4rem;color:var(--gold-text);line-height:1;font-variant-numeric:tabular-nums}
.strikes{display:flex;gap:8px;justify-content:center;min-height:52px}
.strikes span{font-family:var(--f-show);font-weight:900;font-size:2.6rem;line-height:1;color:var(--line)}
.strikes span.on{color:var(--bad)}
.rounds{display:flex;flex-wrap:wrap;gap:6px}
.rounds button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 11px;font-size:.85rem;font-weight:700}
.rounds button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-text)}
.rounds button.used{opacity:.5}

/* Jeopardy */
.jwrap{overflow-x:auto}
.jgrid{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;min-width:640px}
.jcat{background:var(--jblue);border-radius:8px;padding:12px 8px;text-align:center;font-family:var(--f-show);font-weight:800;text-transform:uppercase;font-size:clamp(1rem,1.8vw,1.35rem);line-height:1.05;display:grid;gap:4px;align-content:center;border-bottom:4px solid var(--c);color:var(--white)}
.jcat small{font-family:var(--f-mono);font-size:.68rem;font-weight:500;letter-spacing:.06em;color:rgba(255,255,255,.8)}
.jcell{background:var(--jblue);border:0;box-shadow:0 3px 0 var(--royal-2);border-radius:8px;height:clamp(64px,10vh,96px);font-family:var(--f-show);font-weight:900;font-size:clamp(1.8rem,3.4vw,2.8rem);color:var(--gold-text);text-shadow:2px 2px 0 rgba(0,0,0,.5)}
.jcell:hover:not(:disabled){filter:brightness(1.3)}
.jcell:disabled{opacity:1;background:var(--panel-2);color:transparent;text-shadow:none}
.jclue{font-family:var(--f-show);font-weight:800;text-transform:uppercase;font-size:clamp(1.7rem,4vw,3.2rem);line-height:1.08;text-align:center}
.jresp{text-align:center;font-size:clamp(1.3rem,3vw,2rem);font-weight:700;color:var(--gold-text)}
.dd{font-family:var(--f-show);font-weight:900;font-size:clamp(3rem,10vw,7rem);text-align:center;color:var(--gold-text);line-height:.95;text-transform:uppercase}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tcard{background:var(--panel);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.tcard span{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .btn{padding:7px 12px}

/* Wheel */
.wheel{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:start}
.wcan{position:relative;display:grid;justify-items:center;gap:12px}
.wcan canvas{width:min(420px,82vw);height:auto;aspect-ratio:1;max-width:100%}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--gold);filter:drop-shadow(0 3px 3px rgba(0,0,0,.6));z-index:2}
.wres{font-family:var(--f-show);font-weight:900;font-size:2.2rem;text-transform:uppercase;min-height:2.6rem;text-align:center}
.wboard{background:var(--green);border-radius:16px;padding:clamp(10px,2vw,18px);display:grid;gap:6px;border:4px solid #3D5022}
.wcat{text-align:center;font-family:var(--f-show);font-weight:800;text-transform:uppercase;font-size:clamp(1.1rem,2vw,1.5rem);background:#1C2410;border-radius:8px;padding:6px 10px;color:var(--white)}
.wrow{display:flex;justify-content:center;gap:clamp(2px,.4vw,5px)}
.wt{width:clamp(18px,3.3vw,44px);aspect-ratio:3/4;display:grid;place-items:center;border-radius:4px;font-family:var(--f-show);font-weight:900;font-size:clamp(.9rem,2.4vw,1.9rem);color:#111}
.wt.l{background:var(--white)}
.wt.l.hid{background:var(--white);color:transparent;box-shadow:inset 0 0 0 3px #CFE0B8}
.wt.l.new{animation:flash .9s}
@keyframes flash{0%{background:var(--blue)}100%{background:var(--white)}}
.wt.s{background:transparent}
.keys{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.key{border:0;border-radius:6px;padding:8px 0;font-weight:800;background:var(--panel-2)}
.key.v{background:#5B4A99}
.key:disabled{opacity:.18}
.banks{display:flex;flex-wrap:wrap;gap:8px}
.banks span{background:var(--panel);border-radius:8px;padding:5px 10px;font-size:.9rem;border:1px solid transparent}
.banks span.cur{border-color:var(--gold-text)}
.banks b{font-family:var(--f-mono);color:var(--gold-text);font-variant-numeric:tabular-nums}
.wmsg{background:var(--panel);border-radius:8px;padding:10px 14px;min-height:46px}

/* Heads Up */
.hclock{font-family:var(--f-show);font-weight:900;font-size:3rem;line-height:1;color:var(--gold-text);font-variant-numeric:tabular-nums;min-width:2.2ch;text-align:right}
.hclock.low{color:var(--bad)}
.hcard{flex:1;min-height:300px;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;background:var(--panel-2);border:6px solid var(--c);border-radius:28px;padding:clamp(20px,4vw,48px)}
.hterm{font-family:var(--f-show);font-weight:900;text-transform:uppercase;font-size:clamp(2.8rem,9vw,7rem);line-height:.95;overflow-wrap:anywhere}
.hdef{color:var(--muted);font-size:clamp(1rem,1.6vw,1.2rem);max-width:60ch}
.btn.big{font-size:1.25rem;padding:14px 28px}
.btn.pass{background:#E07B1A;color:var(--white)}
.hflash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;animation:hf .55s forwards}
.hflash.ok{background:rgba(95,168,58,.85)}
.hflash.pass{background:rgba(224,123,26,.85)}
.hflash span{font-family:var(--f-show);font-weight:900;font-size:min(18vw,9rem);text-transform:uppercase;color:var(--white)}
@keyframes hf{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
.hlog{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.hlog li{padding:4px 10px;border-radius:999px;font-weight:600;font-size:.92rem}
.hlog li.ok{background:color-mix(in srgb,var(--ok) 30%,var(--panel))}
.hlog li.no{background:var(--panel);color:var(--muted);text-decoration:line-through}

/* Chase */
.chase{display:grid;grid-template-columns:240px minmax(0,1fr);gap:26px;align-items:start}
.ring{position:relative;width:220px;max-width:100%;aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-show);font-weight:900;font-size:5rem;font-variant-numeric:tabular-nums}
.tally{display:flex;justify-content:center;gap:18px;font-family:var(--f-show);font-size:1.8rem;font-weight:900}
.tally .r{color:var(--ok)}
.tally .w{color:var(--bad)}
.cq{background:var(--panel-2);border-radius:16px;padding:clamp(20px,4vw,40px);font-size:clamp(1.4rem,3vw,2.3rem);font-weight:700;min-height:180px;display:grid;place-items:center;text-align:center;border:2px solid var(--blue)}
.clast{background:var(--panel);border-radius:10px;padding:10px 14px;color:var(--muted)}
.clast b{color:var(--ink)}
.done-card{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:22px;text-align:center;display:grid;gap:10px}
.done-card b{font-family:var(--f-show);font-size:3rem;color:var(--gold-text);line-height:1}

/* Champions */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,22px);flex:1;min-height:340px;padding-top:20px}
.pod{display:grid;justify-items:center;gap:8px;flex:0 1 220px;min-width:0}
.pod .nm{font-weight:700;font-size:clamp(.95rem,2vw,1.3rem);text-align:center}
.pod .pv{font-family:var(--f-mono);color:var(--gold-text);font-variant-numeric:tabular-nums}
.pod .blk{width:100%;border-radius:12px 12px 0 0;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-bottom:0;display:grid;place-items:start center;padding-top:12px;font-family:var(--f-show);font-weight:900;font-size:clamp(2.5rem,6vw,4.5rem);color:var(--muted)}
.pod.p1 .blk{background:linear-gradient(180deg,var(--gold),#B88A10);color:var(--gold-ink)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}

@media (max-width:900px){
  .welcome,.rules,.mill,.feud,.wheel,.chase{grid-template-columns:minmax(0,1fr)}
  .ladder{flex-direction:row-reverse;overflow-x:auto}
  .ladder li{grid-template-columns:auto;white-space:nowrap}
  .ladder li span:first-child,.ladder li span:last-child{display:none}
  .score{flex-wrap:nowrap}
}
@media (max-width:560px){
  .mopts{grid-template-columns:1fr}
  .fboard{grid-template-columns:1fr;grid-auto-flow:row}
  .keys{grid-template-columns:repeat(7,1fr)}
  .crumb{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
