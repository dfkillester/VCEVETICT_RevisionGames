<script>
const D = {"MCQ": [{"u": "310", "q": "A client needs a 10 Gbps cabled link between the switch and a NAS, with a cable run of 80 metres.\nWhich cable type is best?", "o": ["Cat 5e", "Cat 6", "Cat 6a", "Wi-Fi 6"], "a": 2, "e": "Cat 6a supports 10 Gbps over the full 100 m. Cat 6 only reaches 10 Gbps up to about 55 m, Cat 5e tops out at 1 Gbps, and Wi-Fi 6 isn’t a cable."}, {"u": "310", "q": "Which device sends data only to the port of the destination device, using MAC addresses?", "o": ["hub", "switch", "modem", "repeater"], "a": 1, "e": "A switch learns which MAC address is on each port and forwards frames only there. A hub repeats everything to every port."}, {"u": "310", "q": "The router in a home office has a built-in DHCP function.\nThe purpose of DHCP is to", "o": ["translate domain names into IP addresses.", "filter incoming traffic from the internet.", "automatically assign IP addresses to devices on the network.", "encrypt traffic on the wireless network."], "a": 2, "e": "DHCP hands out IP addresses (plus subnet mask, gateway and DNS) automatically. Translating names is DNS’s job."}, {"u": "310", "q": "A SOHO network uses the default gateway 192.168.1.1 with subnet mask 255.255.255.0.\nWhich address could be given to a printer on the same network?", "o": ["192.168.2.20", "192.168.1.300", "10.168.1.20", "192.168.1.20"], "a": 3, "e": "With mask 255.255.255.0 the first three octets (192.168.1) must match. 192.168.1.300 is invalid because an octet can’t exceed 255."}, {"u": "310", "q": "Which one of the following is a private IP address?", "o": ["8.8.8.8", "192.168.0.10", "203.45.10.2", "1.1.1.1"], "a": 1, "e": "192.168.x.x is a private range used inside LANs. The others are public internet addresses."}, {"u": "310", "q": "A technician runs ipconfig on a laptop that can’t reach the internet. The IPv4 address shown is 169.254.12.7.\nWhat is the most likely cause?", "o": ["The laptop could not get an address from the DHCP server.", "The laptop has a correctly configured static address.", "The DNS server is offline.", "The laptop is connected through a VPN."], "a": 0, "e": "169.254.x.x is an automatic fallback address a device gives itself when no DHCP server answers. Check the cable or Wi-Fi connection and the router’s DHCP."}, {"u": "310", "q": "Which command shows each hop that packets take to reach a destination?", "o": ["ping", "ipconfig", "tracert", "nslookup"], "a": 2, "e": "tracert (traceroute) lists each router along the path, which shows where a connection breaks down."}, {"u": "310", "q": "A technician pings the office file server and sees a high percentage of lost packets.\nThis most likely indicates", "o": ["the network is configured correctly.", "a bottleneck or a hardware fault.", "the server does not use DHCP.", "the DNS cache needs clearing."], "a": 1, "e": "Packet loss means data isn’t arriving: congestion, a failing cable, port or NIC are the usual causes."}, {"u": "310", "q": "Which wireless security setting is most secure for a new office router?", "o": ["WEP", "WPS", "WPA", "WPA3"], "a": 3, "e": "WPA3 is the current standard. WEP is easily cracked and WPS has known weaknesses, so both should be avoided."}, {"u": "310", "q": "A dental clinic wants Wi-Fi for patients in the waiting room without risking its internal systems.\nThe best configuration is", "o": ["a separate guest network with no access to the LAN.", "the staff network with its password printed on the wall.", "an open network connected to the file server.", "a hidden SSID using WEP."], "a": 0, "e": "A guest network isolates visitors from internal devices and data while still giving internet access."}, {"u": "310", "q": "Which one of the following should not be done when securing a new SOHO router?", "o": ["Change the default admin password.", "Update the firmware.", "Enable remote management from the internet.", "Disable WPS."], "a": 2, "e": "Remote management lets anyone on the internet try to log in to the router. It should be switched off unless it’s really needed."}, {"u": "310", "q": "A technician has obtained vendor specifications and costs for all components of a SOHO network design.\nWhat is the next step?", "o": ["Install and configure the hardware.", "Present the design to the client and secure sign-off.", "Test the network.", "Develop the user documentation."], "a": 1, "e": "The design (with costs) is presented to the client for sign-off before any installation planning or work begins."}, {"u": "310", "q": "When should a SOHO network be tested?", "o": ["after the hardware and software are installed, before handover", "only after the client reports a problem", "three months after handover", "testing is optional for experienced technicians"], "a": 0, "e": "Testing confirms connectivity, settings and security before the client signs off and takes over the network."}, {"u": "310", "q": "In which topology does every device connect to a central switch?", "o": ["bus", "ring", "star", "mesh"], "a": 2, "e": "Star is the standard SOHO topology. If one cable fails only that device is affected."}, {"u": "310", "q": "Staff at a design studio say opening large files from the NAS is very slow. The NAS and all PCs are connected through an old 10/100 hub.\nWhich change will help most?", "o": ["Change the Wi-Fi channel.", "Replace the hub with a gigabit switch.", "Add a second printer.", "Rename the SSID."], "a": 1, "e": "The hub shares 100 Mbps between everyone and causes collisions. A gigabit switch gives each port its own 1 Gbps link."}, {"u": "310", "q": "Which one of the following could be a symptom of a security intrusion on a SOHO network?", "o": ["Unknown devices appear in the router’s DHCP client list.", "The printer is low on toner.", "A monitor flickers when the room light is on.", "Windows asks to install an update."], "a": 0, "e": "Devices you don’t recognise on your network may mean someone has gained access, especially over Wi-Fi."}, {"u": "310", "q": "What is the purpose of a DNS server?", "o": ["to assign IP addresses to devices", "to translate domain names into IP addresses", "to block malicious traffic", "to store network backups"], "a": 1, "e": "DNS looks up the IP address for a name such as killester.vic.edu.au. A local DNS server caches lookups, cutting traffic to the internet."}, {"u": "310", "q": "Which one of the following is a physical security control for a small office network?", "o": ["a firewall", "WPA3 encryption", "a locked comms cabinet", "antivirus software"], "a": 2, "e": "Physical controls stop people touching the equipment: locks, swipe cards, cabinets. The others are software or network controls."}, {"u": "310", "q": "What is the main advantage of having a local DNS server on an office network?", "o": ["It caches lookups, reducing traffic to and from the internet.", "It assigns IP addresses to devices.", "It stops viruses entering the network.", "It replaces the need for a router."], "a": 0, "e": "A local DNS keeps recently looked-up addresses, so it doesn’t have to ask an internet DNS server every time."}, {"u": "310", "q": "Which one of the following is not a function of a firewall?", "o": ["filtering incoming traffic against rules", "blocking unauthorised access attempts", "scanning files for viruses", "monitoring outgoing traffic"], "a": 2, "e": "Firewalls monitor, filter and block traffic. Scanning for viruses is anti-malware’s job; examiners have refused marks for confusing the two."}, {"u": "310", "q": "A new network printer has the address 172.16.2.40. All other devices are on 172.16.1.x with subnet mask 255.255.255.0 and cannot print.\nWhat is the best fix?", "o": ["Change every computer to 172.16.2.x.", "Change the printer to an unused 172.16.1.x address.", "Change the subnet mask on the router to 255.0.0.0.", "Replace the printer."], "a": 1, "e": "The printer is on a different subnet. Change the new device to match the existing network, not the other way around."}, {"u": "310", "q": "Which device encodes and decodes data so it can pass between the office network and the internet service provider?", "o": ["switch", "modem", "wireless access point", "network attached storage"], "a": 1, "e": "The modem provides the internet connection. The router then shares it with devices on the LAN."}, {"u": "310", "q": "When developing a SOHO network design, which factor is least likely to influence the choice of network equipment?", "o": ["the budget", "the number of devices", "the layout of the office", "the colour of the equipment"], "a": 3, "e": "Budget, device count and layout all shape the design. Colour has no effect on how the network performs."}, {"u": "310", "q": "A home office spreads over three levels and Wi-Fi is weak upstairs.\nWhich solution gives the most seamless coverage?", "o": ["a mesh Wi-Fi system with nodes on each level", "a longer power cable for the router", "switching to WEP", "a 10/100 hub upstairs"], "a": 0, "e": "Mesh nodes work together as one network name, so devices roam between them as they move through the house."}, {"u": "310", "q": "Which item is most important to include in documentation given to the client at handover?", "o": ["the technician’s notes about other clients", "the network diagram and IP address allocations", "marketing brochures from the vendor", "a list of competitors’ prices"], "a": 1, "e": "Handover documents describe this network: diagram, IP table, configuration settings, credentials handed over securely, and sign-off."}, {"u": "310", "q": "Before installation work begins, approval for plans, security clearance and timing must be obtained from", "o": ["the hardware vendor.", "the internet service provider.", "the required personnel, such as the client or manager.", "the other tenants in the building."], "a": 2, "e": "The client (or their nominated manager) approves the plan, grants access to the site and agrees on timing."}, {"u": "305", "q": "When reviewing client support issues, what should be done immediately after checking for new problems logged by the client?", "o": ["Notify the client of the results.", "Check previous logs for similar problems or requests.", "Obtain client feedback.", "Close the ticket."], "a": 1, "e": "Order: check new problems → check previous logs → investigate and document → notify client and advise → obtain feedback and make changes."}, {"u": "305", "q": "Lee runs an IT business and has been asked to set up workstations for a small florist.\nInitial discussions about the number and location of workstations should be held with", "o": ["the delivery drivers.", "the business owner.", "everyone who works in the shopping centre.", "the internet service provider."], "a": 1, "e": "Management makes the initial decisions about budget and location. Users can be consulted later."}, {"u": "305", "q": "Which one of the following is a closed question?", "o": ["Can you describe what happened before the error?", "How do you use the software each day?", "Is the printer switched on?", "What would you like the new system to do?"], "a": 2, "e": "A closed question is answered with yes/no or a single fact. Open questions invite the client to explain."}, {"u": "305", "q": "What is a service level agreement (SLA)?", "o": ["a list of the client’s complaints", "a contract defining the expected level of service, such as response and resolution times", "a manual explaining how to use software", "the warranty card supplied with hardware"], "a": 1, "e": "An SLA sets measurable service levels: services covered, response and resolution times, uptime, responsibilities and penalties."}, {"u": "305", "q": "Which one of the following best describes Level 1 support?", "o": ["developers who fix bugs in source code", "help desk staff who resolve common issues such as password resets", "a manufacturer’s engineers repairing hardware", "a self-help knowledge base"], "a": 1, "e": "Level 1 is the help desk. Level 0 is self-help, Level 2 technical specialists, Level 3 experts or the vendor."}, {"u": "305", "q": "Escalation means", "o": ["closing a ticket without fixing it.", "passing an issue to a higher level of support when it can’t be resolved at the current level.", "raising the price of a support contract.", "asking the client to fix the problem themselves."], "a": 1, "e": "Escalation moves the issue to people with more expertise, often triggered by SLA time limits."}, {"u": "305", "q": "Which one of the following is an example of active listening?", "o": ["interrupting to save time", "using technical jargon to sound professional", "paraphrasing the client’s problem back to confirm understanding", "finishing the client’s sentences"], "a": 2, "e": "Paraphrasing confirms you understood and shows the client you were listening."}, {"u": "305", "q": "An IT company has recommended new accounting software to a client.\nWhat must the company do before implementing it?", "o": ["Write the user manual.", "Obtain approval from the client to implement the solution.", "Buy the licences straight away.", "Install it on a test machine at home."], "a": 1, "e": "The client must approve the solution (and its cost) before implementation."}, {"u": "305", "q": "Why should a support officer check previous help desk logs before replying to a client?", "o": ["to find similar issues and solutions that have already worked", "to increase the number of tickets", "to find someone to blame", "to delete old records"], "a": 0, "e": "Past logs show recurring problems and known fixes, which saves time and gives a consistent response."}, {"u": "305", "q": "When should support or training be scheduled for a client?", "o": ["during the client’s busiest period", "at a time agreed with the client that minimises disruption", "without telling the client", "only on weekends"], "a": 1, "e": "Arrange a time with the client. It should suit them and avoid disrupting their work."}, {"u": "305", "q": "After creating a client feedback form, what is the next step?", "o": ["Review the feedback.", "Provide instructions on how to complete the form and distribute it.", "Make changes to the solution.", "Archive the form."], "a": 1, "e": "Create → provide instructions → distribute → review to identify areas for improvement."}, {"u": "305", "q": "An online feedback form is being sent to clients of a rural accounting firm.\nWhy should an alternative way to give feedback also be offered?", "o": ["Not every client has reliable access to the technology needed.", "Online forms can’t collect ratings.", "Paper forms are always quicker to analyse.", "It is required by the Copyright Act 1968."], "a": 0, "e": "Alternatives make feedback inclusive and accessible for clients who can’t or won’t use online forms."}, {"u": "305", "q": "Which feedback form is most likely to produce useful information?", "o": ["fifty questions on many topics", "a short, clear form mixing rating scales with a few open questions about the support given", "one open question: ‘Any comments?’", "yes/no questions on unrelated topics"], "a": 1, "e": "Short, clear and relevant forms get completed. Rating scales are easy to compare; open questions explain the ratings."}, {"u": "305", "q": "When determining how much technical support a client needs, the support provider should", "o": ["decide alone and inform the client.", "investigate users’ experience levels, then discuss and agree the level of support with the client.", "always provide the maximum level.", "wait until users complain."], "a": 1, "e": "Investigate and document the support needed, then discuss and agree it with the client."}, {"u": "305", "q": "Which one of the following is vendor support?", "o": ["the organisation’s own help desk", "a colleague in the next office", "the manufacturer’s warranty repair service", "the organisation’s internal wiki"], "a": 2, "e": "Vendor support comes from the supplier or manufacturer. The others are in-house support."}, {"u": "305", "q": "Users at a firm have needed high levels of help with new software. Training is planned as five half-day sessions rather than one full day.\nThe main benefit is", "o": ["it costs less to run five sessions.", "users can absorb and practise skills between sessions with less disruption to work.", "the trainer gets more breaks.", "users can skip sessions."], "a": 1, "e": "Shorter sessions reduce overload, give practice time between sessions and keep the office running."}, {"u": "309", "q": "Which one of the following is preventative maintenance?", "o": ["replacing a failed power supply", "cleaning dust from fans and applying updates on a schedule", "reinstalling the OS after a crash", "replacing a cracked screen"], "a": 1, "e": "Preventative maintenance is planned work that stops faults happening. The others fix failures (corrective)."}, {"u": "309", "q": "A technician replaces a hard drive after monitoring software reports increasing S.M.A.R.T. errors, before the drive fails.\nThis is", "o": ["corrective maintenance.", "predictive maintenance.", "reactive maintenance.", "depot maintenance."], "a": 1, "e": "Predictive maintenance uses monitoring data to act before failure."}, {"u": "309", "q": "A technician has already confirmed that a RAM module is faulty and has been asked to replace it.\nWhat should the technician do next?", "o": ["Develop a plan for testing the computer.", "Replace the faulty RAM module.", "Write a report and refer it to another department.", "Run the memory diagnostic again."], "a": 1, "e": "Read where you are in the timeline. The fault is identified and the task is approved, so the next step is the repair."}, {"u": "309", "q": "Toner has spilt inside an office laser printer.\nWhich is the safest way to clean it up?", "o": ["Vacuum it with an ordinary vacuum cleaner.", "Turn off the printer, wear gloves and wipe it with a dry cloth.", "Wash it out with water while the printer is on.", "Blow it out with compressed air in the office."], "a": 1, "e": "Power off, wear PPE and use a dry cloth. Toner is a fine powder that can be dangerous in an ordinary vacuum."}, {"u": "309", "q": "Before replacing RAM in a desktop computer, the technician should first", "o": ["leave the computer running so the RAM can be tested.", "shut down, unplug and wear an anti-static wrist strap.", "put on woollen gloves.", "vacuum inside the case while it is running."], "a": 1, "e": "Power off and unplug for safety, and use ESD protection so static doesn’t damage components."}, {"u": "309", "q": "A technician has tested a faulty laptop and analysed the results.\nWhat is the next step in the fault repair process?", "o": ["Review past fault data.", "Obtain components and repair.", "Identify the faulty equipment.", "Dispose of the laptop."], "a": 0, "e": "Identify → test → analyse → review past fault data → develop plan → liaise and get approval → obtain components and repair."}, {"u": "309", "q": "A technician has developed a plan to replace a faulty motherboard.\nWhat should they do next?", "o": ["Order the part immediately.", "Liaise with the required personnel and obtain approval for the plan.", "Close the job.", "Start the repair."], "a": 1, "e": "Approval comes before spending money or taking the equipment out of service."}, {"u": "309", "q": "When is the best time to carry out scheduled maintenance on office computers?", "o": ["during peak business hours", "outside business hours when users are not present", "whenever a technician is free", "only when a device fails"], "a": 1, "e": "Out-of-hours maintenance avoids interrupting staff, which is also a valid reason for ICT overtime."}, {"u": "309", "q": "How should a school dispose of faulty hard drives?", "o": ["Put them in general waste.", "Wipe or destroy the data, then send them to an accredited e-waste recycler.", "Give them to students.", "Leave them in a storeroom indefinitely."], "a": 1, "e": "E-waste can’t go to landfill in Victoria. Data must be destroyed first to protect privacy."}, {"u": "309", "q": "Which Windows tool shows hardware devices and driver problems?", "o": ["Task Manager", "Device Manager", "Disk Cleanup", "Notepad"], "a": 1, "e": "Device Manager lists hardware and flags devices with driver errors."}, {"u": "309", "q": "Why should maintenance and fault data be recorded?", "o": ["to identify recurring faults and plan future maintenance", "to fill the server", "it is not required", "to advertise the IT team"], "a": 0, "e": "Fault history reveals patterns and helps plan preventative maintenance and replacements."}, {"u": "309", "q": "A technician must move 20 all-in-one PCs onto benches.\nWhich is a correct workplace safety procedure?", "o": ["Carry two at once to save time.", "Clear the path and use a trolley or team lift.", "Drag each PC by its cable.", "Lift with a bent back and straight legs."], "a": 1, "e": "Clear trip hazards, check the weight, use a trolley or team lift and bend the knees."}, {"u": "309", "q": "A projector that is still under warranty stops working.\nWhat should the technician do first?", "o": ["Open it and replace parts.", "Check the warranty terms and contact the vendor.", "Throw it away.", "Buy a new one without checking."], "a": 1, "e": "Opening a device can void the warranty. The vendor should repair or replace it."}, {"u": "309", "q": "A computer beeps several times at start-up and does not load the operating system.\nThis indicates", "o": ["an expired software licence.", "a hardware fault detected by the power-on self-test (POST).", "slow network latency.", "a full recycle bin."], "a": 1, "e": "POST beep codes identify hardware problems such as RAM or graphics faults."}, {"u": "309", "q": "A school wants students to keep working while their faulty laptops are repaired.\nThe best strategy is to", "o": ["keep a pool of loan laptops that run the current software.", "ask students to wait until the repair is finished.", "have students use their phones.", "cancel the class."], "a": 0, "e": "Loan devices remove downtime immediately. Spare parts still require repair time."}, {"u": "312", "q": "What does GPO stand for?", "o": ["General Password Option", "Group Policy Object", "Global Protection Order", "Group Permission Owner"], "a": 1, "e": "A Group Policy Object is a collection of settings, such as password rules, applied to users or computers in Active Directory."}, {"u": "312", "q": "The principle of least privilege means", "o": ["all staff get the same access.", "users get only the access they need to do their job.", "only managers can log in.", "passwords are never changed."], "a": 1, "e": "Limiting access reduces damage from mistakes, insiders and stolen accounts."}, {"u": "312", "q": "Which type of backup only records data that has changed since the last backup of any type?", "o": ["full", "differential", "incremental", "mirror"], "a": 2, "e": "Incremental: changes since the last backup of any kind. Differential: changes since the last full backup."}, {"u": "312", "q": "A differential backup copies", "o": ["everything on the drive.", "all data changed since the last full backup.", "only data changed since the last incremental backup.", "only system files."], "a": 1, "e": "A differential grows each day until the next full backup."}, {"u": "312", "q": "The 3-2-1 backup rule recommends", "o": ["3 backups a day, 2 technicians, 1 server", "3 copies of the data, on 2 different media, with 1 kept off-site", "3 full backups, 2 incremental, 1 differential", "backing up every 3 hours"], "a": 1, "e": "Multiple copies on different media, one off-site, protect against hardware failure, theft and disasters."}, {"u": "312", "q": "A full backup runs Monday night and incremental backups run Tuesday, Wednesday and Thursday nights. The server fails on Friday morning.\nWhich backups are needed to restore all data?", "o": ["Monday only", "Monday and Thursday", "Thursday only", "Monday, Tuesday, Wednesday and Thursday"], "a": 3, "e": "Each incremental only holds one day’s changes, so the full plus every incremental since is needed."}, {"u": "312", "q": "A full backup runs Monday night and differential backups run every other weeknight. The server fails on Friday morning.\nWhich backups are needed?", "o": ["Monday and Thursday", "Thursday only", "Monday, Tuesday, Wednesday and Thursday", "Monday only"], "a": 0, "e": "Thursday’s differential holds every change since Monday’s full, so only two backups are restored."}, {"u": "312", "q": "Which one of the following is an example of multi-factor authentication?", "o": ["a long password", "a password and a code from an authenticator app", "two different passwords", "a username and a password"], "a": 1, "e": "MFA combines different factors: something you know (password) and something you have (phone)."}, {"u": "312", "q": "CVSS is used to", "o": ["rate the severity of security vulnerabilities.", "count software licences.", "schedule backups.", "encrypt wireless traffic."], "a": 0, "e": "The Common Vulnerability Scoring System rates vulnerabilities from 0 to 10 so the worst can be fixed first."}, {"u": "312", "q": "Which detail would not normally be included in a software register?", "o": ["software name and version", "number of licences", "location of licence codes and agreements", "the purchase order number"], "a": 3, "e": "A software register records details about using the software. The 2022 examiners did not count a purchase order number as one of these."}, {"u": "312", "q": "A technician performs a system restore on a staff laptop.\nWhich of the following will not happen?", "o": ["Recently installed apps may be removed.", "Recent updates may need to be reapplied.", "The user’s documents will be deleted.", "System settings return to an earlier point."], "a": 2, "e": "System restore rolls back system files, settings and apps. Personal documents are not deleted."}, {"u": "312", "q": "Which detail would not be recorded in a security access register?", "o": ["the user’s access level", "the date access was granted", "who approved the access", "the user’s home Wi-Fi password"], "a": 3, "e": "The register records user ID, role, access level, dates and approvals. Personal passwords are never recorded."}, {"u": "312", "q": "Software costs $25 per user per month. A business has 5 users and signs a 12-month contract.\nWhat is the total cost?", "o": ["$125", "$300", "$1500", "$3000"], "a": 2, "e": "$25 × 5 users × 12 months = $1500."}, {"u": "312", "q": "Compared with a perpetual licence, a subscription licence", "o": ["is paid once and used forever.", "requires ongoing payments and usually includes updates.", "can’t be used by businesses.", "never includes support."], "a": 1, "e": "Subscriptions spread the cost and include updates, but access stops when payments stop."}, {"u": "312", "q": "When should a technician perform a system restore on a staff computer?", "o": ["as the first troubleshooting step", "as a last resort, with approval from a senior ICT staff member", "whenever a user asks", "every Friday"], "a": 1, "e": "A restore rolls back changes and can remove updates and apps, so other fixes are tried first and approval is needed."}, {"u": "312", "q": "Which is a key task for a systems administrator to ensure organisational security?", "o": ["preventing all updates", "providing access control and enforcing security policies for software and networks", "giving every user administrator rights", "turning off the firewall to improve speed"], "a": 1, "e": "Access control and enforcing security policy are core sysadmin security tasks."}, {"u": "312", "q": "In role-based access control (RBAC), permissions are assigned to", "o": ["each individual user one at a time", "roles or groups, such as ‘Teachers’ or ‘Finance’", "the network switch", "the internet service provider"], "a": 1, "e": "Users join a role and inherit its permissions, which is easier to manage and audit."}, {"u": "312", "q": "An employee receives an email that looks like it’s from the bank, asking them to click a link and enter their login details.\nThis is an example of", "o": ["ransomware", "phishing", "a denial of service attack", "a brute-force attack"], "a": 1, "e": "Phishing tricks people into giving away credentials. Prevent it with training, email filtering and MFA."}, {"u": "312", "q": "Which password policy setting best protects against attackers guessing passwords repeatedly?", "o": ["account lockout after several failed attempts", "allowing passwords of four characters", "never expiring passwords", "displaying passwords on screen"], "a": 0, "e": "Lockout stops brute-force guessing after a set number of failed attempts."}, {"u": "312", "q": "Where should a small accounting firm keep its backups?", "o": ["on one of the workstations for easy access", "in a secure online (cloud) facility", "in the owner’s car", "in an unlocked cupboard in the office"], "a": 1, "e": "Off-site, secure storage protects backups from fire, theft and ransomware that hits the office."}, {"u": "313", "q": "In Australia, copyright protection for software code is obtained", "o": ["by applying to IP Australia.", "automatically when the work is created.", "by registering a trade mark.", "only after the software is sold."], "a": 1, "e": "Copyright is automatic under the Copyright Act 1968. No registration is needed."}, {"u": "313", "q": "An engineer has invented a new robotic arm for sorting library books.\nWhich type of IP protection should she apply for?", "o": ["copyright", "trade mark", "patent", "registered design"], "a": 2, "e": "Patents protect inventions that are new, inventive and useful."}, {"u": "313", "q": "A company wants to stop competitors using its logo.\nWhich type of IP protection applies?", "o": ["patent", "trade mark", "copyright only", "moral rights"], "a": 1, "e": "Logos and brand names are protected by registering a trade mark."}, {"u": "313", "q": "The Designs Act 2003 protects", "o": ["the way a product works.", "the visual appearance of a product.", "computer source code.", "customer data."], "a": 1, "e": "A registered design protects shape, configuration, pattern and ornamentation, not function."}, {"u": "313", "q": "A help desk employee writes a user manual for the company’s software during work hours as part of his job.\nWho owns the copyright?", "o": ["the employee", "the company", "the software users", "no one"], "a": 1, "e": "Work created in the course of employment generally belongs to the employer."}, {"u": "313", "q": "A sports club with an annual turnover of $5 million collects members’ contact details.\nWhy must it comply with the Privacy Act 1988?", "o": ["Its turnover is over $3 million.", "All clubs are government agencies.", "It has a website.", "It employs casual staff."], "a": 0, "e": "The Privacy Act covers organisations with annual turnover over $3 million, plus government agencies and some smaller businesses."}, {"u": "313", "q": "A notifiable data breach occurs when", "o": ["any information is accessed by an employee.", "personal information is lost or subjected to unauthorised access or disclosure and serious harm is likely.", "a website goes offline.", "corporate financial records are emailed internally."], "a": 1, "e": "Under the NDB scheme, eligible breaches involve personal information and a likely risk of serious harm."}, {"u": "313", "q": "What is the correct order of steps when responding to a data breach?", "o": ["Notify, Contain, Review, Assess", "Assess, Review, Contain, Notify", "Contain, Assess, Notify, Review", "Review, Notify, Assess, Contain"], "a": 2, "e": "Contain the breach first, assess the risk, notify the OAIC and individuals, then review to prevent it happening again."}, {"u": "313", "q": "Which Australian Privacy Principle requires organisations to protect personal information from misuse, loss and unauthorised access?", "o": ["APP 1", "APP 6", "APP 11", "APP 13"], "a": 2, "e": "APP 11 covers security of personal information, including destroying or de-identifying it when it’s no longer needed."}, {"u": "313", "q": "A gym collected members’ emails to send booking confirmations. It now wants to sell the list to a supplement company.\nWhich APP does this most clearly breach?", "o": ["APP 6: use or disclosure", "APP 2: anonymity", "APP 10: quality", "APP 12: access"], "a": 0, "e": "APP 6: information can only be used or disclosed for the purpose it was collected, unless an exception (such as consent) applies."}, {"u": "313", "q": "Which ethical theory judges an action by whether it produces the greatest good for the greatest number?", "o": ["deontological ethics", "virtue ethics", "utilitarianism", "ethical egoism"], "a": 2, "e": "Utilitarianism (Bentham, Mill) focuses on outcomes for the most people."}, {"u": "313", "q": "A company follows a strict rule never to sell user data, even when doing so would be profitable.\nWhich ethical approach is this?", "o": ["utilitarianism", "deontological ethics", "relativism", "ethical egoism"], "a": 1, "e": "Deontological ethics is about following rules and duties regardless of the outcome."}, {"u": "313", "q": "The ACS Code of Professional Ethics is based on which three values?", "o": ["honesty, trustworthiness, respect", "speed, profit, innovation", "privacy, security, uptime", "loyalty, secrecy, obedience"], "a": 0, "e": "The 2023 ACS code rests on honesty, trustworthiness and respect."}, {"u": "313", "q": "Australia’s AI Ethics Principles should be applied", "o": ["on a voluntary basis.", "only by government agencies.", "instead of existing laws.", "only when AI is used for games."], "a": 0, "e": "The eight AI Ethics Principles are voluntary guidance; they don’t replace laws."}, {"u": "313", "q": "Which one of the following is one of Australia’s AI Ethics Principles?", "o": ["contestability", "profitability", "speed", "secrecy"], "a": 0, "e": "Contestability: people significantly affected by an AI system should be able to challenge its outcomes."}, {"u": "313", "q": "Where should a school store its IP, ethics and privacy policies?", "o": ["on the intranet, where all staff can access them", "locked in the principal’s office", "on the IT manager’s laptop", "schools don’t need these policies"], "a": 0, "e": "Staff can only follow policies they can find, so they belong on the intranet."}, {"u": "313", "q": "You discover a colleague using copyrighted material without permission in a company project.\nWhat is the best action?", "o": ["Use it too, since it helps the project.", "Report it to the Compliance Officer.", "Assume the manager has approved it.", "Post about it on social media."], "a": 1, "e": "Follow the organisation’s procedure and report non-compliance to the person responsible."}, {"u": "313", "q": "Which one of the following is not a fair dealing purpose under the Copyright Act?", "o": ["research or study", "criticism or review", "parody or satire", "selling photocopies of a textbook for profit"], "a": 3, "e": "Fair dealing allows limited use for set purposes. Copying for profit isn’t one of them."}, {"u": "313", "q": "A graphic artist uses a free online generative AI tool. He types a basic prompt and the tool creates an image.\nWho owns the copyright in the image?", "o": ["the artist", "the tool’s creators", "no one", "the artist’s employer"], "a": 2, "e": "Australian copyright needs a human author. A purely AI-generated image from a basic prompt is unlikely to be protected."}, {"u": "313", "q": "Which list contains only items included in a typical code of ethics?", "o": ["fair treatment, privacy, rules, regulations", "privacy, honesty, communication, legislation", "fair treatment, privacy, communication, honesty", "education, cooperation, privacy, honesty"], "a": 2, "e": "Regulations and legislation are laws, not ethics. Education and cooperation are not ethics principles."}, {"u": "313", "q": "Copyright protects", "o": ["an idea, as soon as you think of it.", "the material expression of an idea, such as written text or code.", "a brand name once it is registered.", "an invention for 20 years."], "a": 1, "e": "Copyright covers the expression of an idea, not the idea itself, and applies automatically once it exists in material form."}, {"u": "313", "q": "Which item does an organisation’s privacy policy not need to include?", "o": ["what personal information is collected", "how to make a complaint", "the technical details of its security measures", "how to access or correct personal information"], "a": 2, "e": "A privacy policy explains collection, use, disclosure, access, correction and complaints. It doesn’t need to list security measures."}, {"u": "313", "q": "A café owner wants to use a photo from another business’s website on her own site.\nWhat must she do?", "o": ["Credit the photographer underneath the image.", "Obtain written permission from the copyright owner.", "Change the photo’s colours slightly.", "Nothing, because it’s publicly available online."], "a": 1, "e": "Permission must come from the owner. Crediting the author is not enough for business use."}, {"u": "313", "q": "An organisation is no longer legally required to keep a former customer’s personal information.\nIt should", "o": ["sell it to another business.", "destroy it or de-identify it.", "use it for advertising.", "publish it."], "a": 1, "e": "APP 11.2: take reasonable steps to destroy or de-identify personal information that is no longer needed."}, {"u": "313", "q": "Moral rights give a creator the right to", "o": ["be named as the creator of their work.", "sell their work for any price.", "register a patent for free.", "access anyone’s personal data."], "a": 0, "e": "Moral rights include attribution, not being falsely attributed, and integrity (no derogatory treatment)."}, {"u": "313", "q": "Why are clear IP and ethics policies essential for organisations?", "o": ["for legal compliance", "to reduce the need for staff", "to help competitors", "to increase prices"], "a": 0, "e": "Clear policies help the organisation meet its legal obligations and guide staff decisions."}, {"u": "313", "q": "A council is replacing phone bookings with an online-only system. Many older residents have limited computer skills.\nThe main ethical consideration is", "o": ["the cost of web hosting", "fair treatment and accessibility for all residents", "the colour scheme of the website", "the speed of the server"], "a": 1, "e": "An ethical system doesn’t exclude people. Offer support, training or a phone option during the transition."}], "GLOSSARY": [["Intellectual property (IP)", "Legal rights over creations of the mind: inventions, writing, designs, symbols, names and images.", "313", 1], ["Copyright", "Automatic legal protection for the expression of original work (text, code, images, music). No registration needed.", "313", 1], ["Patent", "Registered protection for an invention that is new, inventive and useful; must be applied for through IP Australia.", "313", 1], ["Trade mark", "Registered protection for a logo, brand name, slogan or other sign that identifies a business’s goods or services.", "313", 1], ["Trade secret", "Valuable confidential business information (e.g. a formula or algorithm) protected by keeping it secret, not by registration.", "313", 1], ["Ethics (in ICT)", "Principles of right and wrong that guide how ICT professionals act, e.g. honesty, fairness, privacy, respect.", "313", 1], ["Privacy policy", "A document telling people how an organisation collects, stores, uses and discloses their personal information.", "313", 1], ["Data protection", "Measures (technical and procedural) that keep data safe from loss, misuse and unauthorised access.", "313", 1], ["Non-compliance", "Failing to follow a law, regulation, policy or procedure.", "313", 1], ["Organisational policy and procedure", "A policy states an organisation’s rules or position; a procedure sets out the steps to follow it.", "313", 1], ["Infringement", "Using someone’s IP (copying, selling, adapting) without permission or legal right.", "313", 1], ["Authorisation (for the use of IP)", "Permission, ideally written, from the IP owner to use their work, often given through a licence.", "313", 1], ["Risk assessment", "Identifying risks, then rating their likelihood and consequence to decide what action to take.", "313", 1], ["Moral/professional responsibility", "The duty to act ethically and competently in your role, beyond just obeying the law.", "313", 1], ["Stakeholder", "Anyone affected by or with an interest in a project or decision: clients, staff, managers, suppliers.", "313,305", 1], ["Lawful use", "Using IP or data in a way the law allows, e.g. with permission, under a licence or under fair dealing.", "313", 1], ["Privacy Act 1988 (Cth)", "Federal law regulating how government agencies and organisations with turnover over $3 million handle personal information.", "313", 1], ["Information Privacy Principles (IPPs)", "10 privacy principles for Victorian public sector bodies (incl. government schools) under Victoria’s Privacy and Data Protection Act 2014. Federally, the 13 APPs replaced the old IPPs in 2014.", "313", 1], ["Data breach", "When personal information is lost, or accessed or disclosed without authorisation.", "313", 1], ["Confidential information", "Information that must not be shared without permission, e.g. client records or business plans.", "313", 1], ["Registered design", "Protection for the visual appearance of a product (shape, pattern) under the Designs Act 2003.", "313", 0], ["Moral rights", "A creator’s right to be named and to have their work treated with respect.", "313", 0], ["Fair dealing", "Limited use of copyright material for study, review, parody or news without permission.", "313", 0], ["APPs", "The 13 Australian Privacy Principles in the Privacy Act 1988.", "313", 0], ["OAIC", "Office of the Australian Information Commissioner: the regulator told about eligible data breaches.", "313", 0], ["NDB scheme", "Law requiring notification of data breaches likely to cause serious harm.", "313", 0], ["Personal information", "Information that identifies, or could reasonably identify, a person.", "313", 0], ["De-identify", "Remove details so information no longer identifies anyone.", "313", 0], ["Written consent", "Signed permission from a person to collect or use their information.", "313", 0], ["Ethical dilemma", "A choice between gaining something and doing the right thing.", "313", 0], ["Code of ethics", "A set of principles guiding professional behaviour, e.g. fair treatment, privacy, communication, honesty.", "313", 0], ["Utilitarianism", "The right action gives the greatest good for the greatest number.", "313", 0], ["Deontological ethics", "The right action follows rules and duties, whatever the outcome.", "313", 0], ["Virtue ethics", "The right action is what a person of good character would do.", "313", 0], ["System administration", "Managing and maintaining an organisation’s computers, servers, users, security and backups.", "312", 1], ["Operating system (OS)", "Software that manages hardware, files, memory and programs, e.g. Windows, macOS, Linux.", "312", 1], ["User account management", "Creating, changing, disabling and deleting user accounts and their group memberships.", "312", 1], ["Access rights/permissions", "What a user is allowed to do with a file, folder or system, e.g. read, write, modify, full control.", "312", 1], ["Software licensing", "The legal agreement setting how software may be used, installed and paid for.", "312", 1], ["Backup and restore (system)", "Copying system data so it can be returned (restored) after loss, corruption or failure.", "312", 1], ["Client-server environment", "A network where client computers request services (files, logins, email) from central servers.", "312", 1], ["Stand-alone system", "A computer that works on its own, not connected to a network or server.", "312", 1], ["Security access control", "Methods that make sure only authorised people can access systems, data or rooms.", "312", 1], ["System restore point", "A saved snapshot of system files and settings that a computer can be rolled back to.", "312", 1], ["System service/process", "A program running in the background or foreground; services start with the OS (e.g. print spooler).", "312", 1], ["Patch management", "Finding, testing and installing software updates that fix bugs and security holes.", "312", 1], ["Audit log", "A time-stamped record of system activity, e.g. logins, file access and changes.", "312", 1], ["Group Policy", "Windows tool for applying settings (e.g. password rules) to many users or computers at once, using GPOs.", "312", 1], ["Resource allocation", "Sharing system resources (storage, CPU, bandwidth, licences) between users and tasks.", "312", 1], ["Administrator privileges", "The highest level of access, allowing full control over a system’s settings and software.", "312", 1], ["System performance monitoring", "Tracking CPU, memory, disk and network use to spot problems early.", "312", 1], ["Disaster recovery", "The plan and steps to restore ICT systems and data after a major failure or disaster.", "312", 1], ["Configuration management", "Recording and controlling the settings of systems so changes are tracked and consistent.", "312", 1], ["User authentication", "Checking that users are who they claim to be, e.g. password, MFA, biometrics.", "312", 1], ["GPO", "Group Policy Object: a set of settings applied to users or computers.", "312", 0], ["Least privilege", "Users get only the access they need for their job.", "312", 0], ["RBAC", "Role-based access control: permissions are assigned to roles.", "312", 0], ["MFA", "Logging in with two or more different types of proof.", "312", 0], ["Incremental backup", "Copies changes since the last backup of any type.", "312", 0], ["Differential backup", "Copies changes since the last full backup.", "312", 0], ["3-2-1 rule", "3 copies, 2 different media, 1 off-site.", "312", 0], ["CVSS", "A 0–10 scale that rates how severe a vulnerability is.", "312", 0], ["Phishing", "A fake message that tricks people into giving away credentials.", "312", 0], ["Ransomware", "Malware that encrypts files and demands payment.", "312", 0], ["Security access register", "Record of who has access to what, when and who approved it.", "312", 0], ["EULA", "End user licence agreement: the terms for using software.", "312", 0], ["Active listening", "Giving full attention, letting the client finish, and paraphrasing their issue back to confirm it.", "305", 1], ["Knowledge base", "A searchable library of known problems, solutions and how-to articles.", "305", 1], ["Database", "An organised collection of related data that can be searched, sorted and updated, e.g. help desk tickets.", "305", 1], ["Closed question", "A question answered with yes/no or a single fact.", "305", 1], ["Open question", "A question that invites the client to explain in detail.", "305", 1], ["Technical jargon", "Specialist terms that non-technical clients may not understand.", "305", 1], ["Constraint", "A limit on a solution, e.g. budget, time, existing hardware or staff skills.", "305", 1], ["Policy", "An organisation’s formal rules or position on an issue, e.g. acceptable use policy.", "305", 1], ["On-site examination", "Inspecting a problem in person at the client’s location.", "305", 1], ["Escalation", "Passing an issue to a higher level of support when it can’t be solved at the current level or within the SLA time.", "305", 1], ["Procedure", "The set of steps to follow to complete a task correctly.", "305", 1], ["Training manual", "A document that teaches users how to use a system, step by step.", "305", 1], ["Feedback", "Information from clients about how well a solution or service met their needs.", "305", 1], ["Service level agreement (SLA)", "Contract setting the expected level of service, e.g. response and resolution times, uptime, penalties.", "305,309", 1], ["Procedural manual", "A document setting out an organisation’s procedures for staff to follow.", "305", 1], ["Help desk", "The first point of contact for users needing ICT support.", "305", 1], ["Troubleshooting", "A logical process of finding the cause of a problem and fixing it.", "305,309", 1], ["Levels of support", "Tiers of help: Level 0 self-help, Level 1 help desk, Level 2 specialists, Level 3 experts or vendor.", "305", 1], ["Client (internal/external)", "Who you support: internal clients work in your organisation; external clients are outside customers.", "305", 1], ["Needs analysis", "Investigating what a client needs a system to do before recommending a solution.", "305", 1], ["Stakeholder consultation", "Asking the people affected by a change for their input before deciding.", "305", 1], ["Cost-benefit analysis", "Comparing the costs of a solution with its benefits to decide if it’s worthwhile.", "305", 1], ["Incident report/support ticket", "A record of a reported problem, its details, priority, actions taken and outcome.", "305", 1], ["Client satisfaction", "How happy the client is with the solution and support, usually measured with feedback.", "305", 1], ["Support strategy", "The planned approach to supporting clients: support levels, channels, training and response times.", "305", 1], ["Vendor support", "Help provided by the supplier or manufacturer.", "305", 0], ["Bandwidth", "The maximum amount of data that can be sent per second, e.g. 1 Gbps.", "310", 1], ["Industry standards", "Agreed rules that make equipment work together safely, e.g. IEEE 802.11, Cat 6, AS/NZS cabling standards.", "310", 1], ["Network transmission media", "The physical path data travels on: copper cable, fibre optic or wireless.", "310", 1], ["Data transmission", "Sending data from one device to another over a network.", "310", 1], ["Latency", "The delay before data arrives, measured in milliseconds.", "310", 1], ["Networking tools", "Hardware and software for building and testing networks, e.g. crimper, cable tester, ping, ipconfig.", "310", 1], ["Full-duplex", "Data travels in both directions at the same time, e.g. a phone call.", "310", 1], ["Local area network (LAN)", "A network covering a small area such as an office, home or school.", "310", 1], ["Protocols", "Agreed rules for how data is formatted and sent, e.g. TCP/IP, HTTP, DHCP.", "310", 1], ["Half-duplex", "Data travels in both directions, but only one way at a time, e.g. a walkie-talkie.", "310", 1], ["Simplex", "Data travels in one direction only, e.g. a broadcast to a TV.", "310", 1], ["Modem", "Encodes and decodes data so it can pass between the network and the ISP.", "310", 1], ["Router", "Connects networks and directs packets to the right IP address; shares the internet connection with the LAN.", "310", 1], ["Network interface card (NIC)", "Hardware in a device that connects it to a network; has a unique MAC address.", "310", 1], ["Network security", "Hardware, software and policies that protect a network and its data from unauthorised access.", "310", 1], ["Node/endpoint device", "Any device connected to a network, e.g. computer, printer, phone.", "310", 1], ["Network types (topologies)", "The layout of how devices connect: star, bus, ring, mesh.", "310", 1], ["SOHO network", "Small office or home office network: a small LAN, usually with one router connected to the internet.", "310", 1], ["Firewall", "Monitors and filters incoming and outgoing traffic against a set of rules, blocking unauthorised access.", "310", 1], ["Network topology", "The physical or logical arrangement of devices and connections in a network.", "310", 1], ["Switch", "Connects LAN devices and sends each frame only to the destination port using MAC addresses.", "310", 1], ["Virtual private network (VPN)", "An encrypted tunnel over the internet for secure remote access.", "310", 1], ["Mesh network", "Each node connects to several others, so data has more than one path. Mesh Wi-Fi gives seamless coverage.", "310", 1], ["Wireless access point (WAP)", "Lets Wi-Fi devices join the wired network.", "310", 1], ["Voice over Internet Protocol (VoIP)", "Making phone calls over a data network instead of phone lines.", "310", 1], ["Coaxial cable", "Copper cable with a central conductor and shielding, used for cable TV and older networks.", "310", 1], ["Hub", "Repeats incoming signals to every port; causes collisions and bottlenecks.", "310", 1], ["Wide area network (WAN)", "A network covering a large area, linking LANs across cities or countries; the internet is the largest.", "310", 1], ["802.11", "The IEEE family of Wi-Fi standards, e.g. 802.11ac (Wi-Fi 5), 802.11ax (Wi-Fi 6).", "310", 1], ["Network attached storage (NAS)", "A storage device on the network that everyone can access, used for shared files and backups.", "310", 1], ["Twisted pair cable", "Copper cable with pairs of wires twisted to reduce interference, e.g. Cat 5e, Cat 6 (UTP = unshielded twisted pair).", "310", 1], ["Fibre optic cable", "Sends data as light through glass; very fast, long distance, immune to electrical interference.", "310", 1], ["Star network topology", "Every device connects to a central switch. One cable failing affects only that device.", "310", 1], ["Ethernet cable", "Twisted pair cable with RJ45 connectors used for wired LANs.", "310", 1], ["Bluetooth", "Short-range wireless technology for connecting nearby devices, e.g. keyboards and headsets.", "310", 1], ["Ring network topology", "Devices connect in a closed loop and data passes from one to the next.", "310", 1], ["Terminator", "A device fitted at each end of a bus network cable to stop signals bouncing back.", "310", 1], ["Print server", "A device or computer that manages print jobs for networked printers.", "310", 1], ["Bus network topology", "All devices connect to one main cable (backbone) with a terminator at each end.", "310", 1], ["Server", "A computer that provides services to others on the network, e.g. files, email, websites.", "310", 1], ["Network operating system (NOS)", "An operating system designed to manage network resources, users and security, e.g. Windows Server.", "310", 1], ["Intranet", "A private network website only for an organisation’s staff.", "310", 1], ["Extranet", "Part of an intranet that approved outsiders (e.g. suppliers, clients) can log in to.", "310", 1], ["Network segmentation", "Dividing a network into separate parts (e.g. guest and staff) to limit access and the spread of attacks.", "310", 1], ["Vulnerability", "A weakness that could be exploited, e.g. unpatched software or a default password.", "310,312", 1], ["Threat/bad actor", "Anything or anyone that could cause harm to a system; a bad actor is a person who does it deliberately.", "310,312", 1], ["DHCP", "Automatically assigns IP addresses to devices.", "310", 0], ["DNS", "Translates domain names into IP addresses.", "310", 0], ["SSID", "The name of a wireless network.", "310", 0], ["Default gateway", "The router address devices send traffic to when it’s leaving the local network.", "310", 0], ["Subnet mask", "Shows which part of an IP address identifies the network.", "310", 0], ["Bottleneck", "A point in the network that slows all traffic passing through it.", "310", 0], ["IDS", "Intrusion detection system: monitors for malicious activity and raises alerts.", "310", 0], ["Maintenance", "Work done to keep ICT equipment and software working properly.", "309", 1], ["Preventative maintenance", "Scheduled work that stops faults before they happen, e.g. cleaning, updates.", "309", 1], ["Corrective maintenance", "Repairing equipment after it has failed.", "309", 1], ["Fault diagnosis", "Testing and analysing to find the cause of a fault.", "309", 1], ["Fault repair", "Fixing or replacing the faulty part or software so the equipment works again.", "309", 1], ["ICT equipment (hardware)", "The physical parts of ICT systems: computers, printers, network devices, peripherals.", "309", 1], ["Software maintenance", "Updating, patching, reinstalling and configuring software to keep it working and secure.", "309", 1], ["Organisational procedure", "The organisation’s set steps for a task, e.g. how to log and approve a repair.", "309", 1], ["Hardware components", "The parts inside or attached to a computer, e.g. CPU, RAM, storage, power supply.", "309", 1], ["Software applications", "Programs that let users do tasks, e.g. word processing, accounting, email.", "309", 1], ["Performance degradation", "A gradual drop in speed or reliability, e.g. from a full disk, overheating or ageing parts.", "309", 1], ["Replacement/upgrade", "Swapping a faulty or outdated part for a new or better one.", "309", 1], ["Asset lifecycle", "The stages of equipment from purchase, use and maintenance to replacement and disposal.", "309", 1], ["Log/record keeping", "Recording maintenance, faults and changes so there is a history to refer to.", "309", 1], ["Warranty/service contract", "A warranty is the maker’s promise to repair or replace; a service contract is paid ongoing support.", "309", 1], ["Safety standards", "Rules and codes for safe work with equipment, e.g. electrical safety, manual handling, ESD.", "309", 1], ["OH&S", "Occupational health and safety (in Victoria): keeping people safe at work. Also called WHS.", "309", 1], ["Backup", "A copy of data kept so it can be restored if the original is lost or damaged.", "309,312", 1], ["Restore", "Copying data back from a backup to replace lost or damaged data.", "309,312", 1], ["Test environment", "A separate system for testing changes or repairs before using them on live systems.", "309", 1], ["Downtime", "Time when a system or device is unavailable to users.", "309", 1], ["Predictive maintenance", "Using monitoring data to replace parts before they fail.", "309", 0], ["ESD", "Electrostatic discharge: static that can destroy components.", "309", 0], ["POST", "Power-on self-test that checks hardware at start-up.", "309", 0], ["E-waste", "Discarded electronic equipment that must be recycled, not sent to landfill.", "309", 0], ["Return to depot", "Sending faulty equipment back to the supplier for repair.", "309", 0], ["Asset register", "A record of all ICT equipment, where it is and its history.", "309", 0]], "ACRONYMS": [["DHCP", ["dynamic host configuration protocol"]], ["DNS", ["domain name system", "domain name server", "domain name service"]], ["LAN", ["local area network"]], ["WAN", ["wide area network"]], ["WAP", ["wireless access point"]], ["NAS", ["network attached storage"]], ["NIC", ["network interface card", "network interface controller"]], ["VPN", ["virtual private network"]], ["SSID", ["service set identifier"]], ["SOHO", ["small office home office", "small office or home office"]], ["VoIP", ["voice over internet protocol", "voice over ip"]], ["WPA", ["wifi protected access", "wi fi protected access", "wireless protected access"]], ["ISP", ["internet service provider"]], ["NBN", ["national broadband network"]], ["TCP", ["transmission control protocol"]], ["IP", ["internet protocol", "intellectual property"]], ["HTTPS", ["hypertext transfer protocol secure"]], ["SMTP", ["simple mail transfer protocol"]], ["IMAP", ["internet message access protocol"]], ["FTP", ["file transfer protocol"]], ["MAC", ["media access control"]], ["QoS", ["quality of service"]], ["SLA", ["service level agreement"]], ["FAQ", ["frequently asked questions"]], ["ESD", ["electrostatic discharge"]], ["WHS", ["work health and safety", "workplace health and safety"]], ["POST", ["power on self test"]], ["PSU", ["power supply unit"]], ["RAM", ["random access memory"]], ["GPO", ["group policy object"]], ["MFA", ["multi factor authentication", "multifactor authentication"]], ["RBAC", ["role based access control"]], ["CVSS", ["common vulnerability scoring system"]], ["EULA", ["end user licence agreement", "end user license agreement"]], ["OU", ["organisational unit", "organizational unit"]], ["APP", ["australian privacy principle", "australian privacy principles"]], ["NDB", ["notifiable data breach", "notifiable data breaches"]], ["OAIC", ["office of the australian information commissioner"]], ["ACS", ["australian co         <div class="strikes" aria-label="${F.strikes} strikes">${[0, 1, 2].map(k => `<span class="${k < F.strikes ? "on" : ""}">✕</span>`).join("")}</div>
        <p class="tip" style="text-align:center">${F.banked ? "Pot banked. Flip the rest, then move on." : F.strikes >= 3 ? `Three strikes! Next team can steal.` : `In play: <b class="curname"></b>`}</p>
        <button class="btn no" type="button" data-a="strike" ${F.banked || F.strikes >= 3 ? "disabled" : ""}>Strike ✕</button>
        <button class="btn ghost" type="button" data-a="unstrike" ${!F.strikes || F.banked ? "disabled" : ""}>Undo a strike</button>
        <button class="btn" type="button" data-a="pass">Pass to next team</button>
        <button class="btn ok" type="button" data-a="bank" ${F.banked || !F.pot ? "disabled" : ""}>Bank pot to <span class="curname"></span></button>
        <button class="btn ghost" type="button" data-a="all">Flip the rest</button>
        <button class="btn go" type="button" data-a="nextb">${F.b === FEUD.length - 1 ? "Back to the menu" : "Next board ▶"}</button>
      </div></div>`;
    refreshNames();
  };
  const flip = k => {
    const A = FEUD[F.b].a[k]; if (!A || F.open.has(k)) return;

    if (!F.banked) F.pot += A[1];
    sfx.right(); render();
  };
  const focusGuess = () => { const i = box.querySelector("#feud-guess"); if (i && !i.disabled) i.focus(); };
  const strike = () => { F.strikes++; sfx.wrong(); bigX(); };
  const check = text => {
    if (!text.trim() || F.banked) return;
    const k = feudMatch(FEUD[F.b], text), steal = F.strikes >= 3;
    if (k >= 0 && F.open.has(k)) { F.msg = `"${esc(text)}" is already on the board as ${esc(FEUD[F.b].a[k][0])}. No strike.`; F.msgType = ""; render(); focusGuess(); return; }
    if (k >= 0) {
      F.msg = steal ? `Stolen! "${esc(text)}" matches ${esc(FEUD[F.b].a[k][0])}. Bank the pot to <b class="curname"></b>.` : `Survey says… "${esc(text)}" matches ${esc(FEUD[F.b].a[k][0])}!`;
      F.msgType = "good"; flip(k);
    } else if (steal) {
      F.msg = `"${esc(text)}" isn't on the board. Steal failed: make it the other team's turn and bank the pot to them.`; F.msgType = "bad"; sfx.wrong(); bigX(); render();
    } else {
      strike(); F.msg = `"${esc(text)}" isn't on the board. Strike ${F.strikes}!${F.strikes >= 3 ? " Next team gets one guess to steal." : ""}`; F.msgType = "bad";
      if (F.strikes >= 3) { S.onTurn = null; nextTeam(); S.onTurn = () => render(); }
      render();
    }
    focusGuess();
  };
  box.onclick = e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.dataset.t !== undefined) { flip(+b.dataset.t); return; }
    if (b.dataset.b !== undefined) { newFeud(+b.dataset.b); render(); focusGuess(); return; }
    const a = b.dataset.a;
    if (a === "strike") { strike(); F.msg = `Strike ${F.strikes}!`; F.msgType = "bad"; render(); }
    if (a === "unstrike") { F.strikes = Math.max(0, F.strikes - 1); F.msg = "Strike taken back."; F.msgType = ""; render(); }
    if (a === "pass") { nextTeam(); }

    if (a === "nextb") { if (F.b === FEUD.length - 1) go(0); else { newFeud(F.b + 1); render(); focusGuess(); } }

    if (k.toLowerCase() === "x" && !F.banked && F.strikes < 3) { strike(); F.msg = `Strike ${F.strikes}!`; F.msgType = "bad"; render(); return true; }

}

/* ---------- 3. Jeopardy ---------- */
const JVALS = [20, 40, 60, 80, 100];

function newJeop() {

    const pool = D.GLOSSARY.filter(g => g[2] === u && !["Policy", "Client (internal/external)", "802.11"].includes(g[0]));
    const pick = shuffle(pool.filter(g => g[3] === 1)).slice(0, 4).concat(shuffle(pool.filter(g => g[3] === 0)).slice(0, 1));
    while (pick.length < 5) pick.push(shuffle(pool).find(g => !pick.includes(g)));

  });

}

      <div class="jwrap"><div class="jgrid">
        ${J.cols.map(c => `<div class="jcat" style="--c:${UCOL[c.u]}">${esc(UNITS[c.u].short)}<small>${esc(UNITS[c.u].code)}</small></div>`).join("")}
        ${JVALS.map((v, r) => J.cols.map((c, ci) => `<button class="jcell" type="button" data-c="${ci}" data-r="${r}" ${c.clues[r].used ? "disabled aria-label=\"Used\"" : ""}>${v}</button>`).join("")).join("")}
      </div></div>
      <div class="nextcue"><button class="btn go" type="button" data-a="next">Back to the menu</button></div>`;
    refreshNames();
  };
  const open = (ci, r) => {
    const col = J.cols[ci], cl = col.clues[r];

    const showClue = m => {
      m.querySelector(".modal-box").innerHTML = `${head}<p class="jclue">${esc(cl.clue)}</p>
        <div class="jresp" hidden id="jr">What is ${/^[A-Z0-9.]+$/.test(cl.g[0]) ? "" : ""}${esc(cl.g[0])}?</div>
        <div class="row" style="justify-content:center"><button class="btn ghost" type="button" data-think="1">♪ 30-second thinking music</button><button class="btn go" type="button" data-show="1">Show the response</button></div>
        <div class="tgrid">${S.teams.map((t, i) => `<div class="tcard"><span data-tname="${i}">${esc(t.name)}</span><button class="btn ok" type="button" data-ok="${i}" aria-label="Correct for ${esc(t.name)}">+${val}</button><button class="btn no" type="button" data-no="${i}" aria-label="Wrong for ${esc(t.name)}">−${val}</button></div>`).join("")}</div>
        <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-close="1">Back to the board</button></div>`;
    };
    cl.used = true; stopMusic();
    const m = modal(isDD ? `${head}<p class="dd">Daily<br>Double!</p><p class="tip" style="text-align:center">Only <b class="curname"></b> may answer, for double points.</p><div class="row" style="justify-content:center"><button class="btn go" type="button" data-clue="1">Show the clue</button></div>` : "",
      (b, m) => {
        if (b.dataset.clue) showClue(m);
        if (b.dataset.think) { if (mus && mus.key === "think") { stopMusic(); b.textContent = "♪ 30-second thinking music"; } else { setMusic(true); playMusic("think", { loop: true, max: 30, vol: .6, onEnd: () => { b.textContent = "♪ Time's up"; } }); b.textContent = "■ Stop the music"; } }
        if (b.dataset.show) { stopMusic(); m.querySelector("#jr").hidden = false; b.hidden = true; sfx.reveal(); }
        if (b.dataset.ok !== undefined) { award(+b.dataset.ok, val); sfx.right(); setCur(+b.dataset.ok); b.disabled = true; m.querySelector("#jr").hidden = false; }

/* ---------- 4. Wheel of Fortune ---------- */
const WEDGES = [50, "BANKRUPT", 75, 25, 100, 40, "LOSE A TURN", 60, 35, 80, 45, 20, 90, 55, 70, 30];
const WCOL = ["#0F9AD6", "#111111", "#FFC530", "#556D31", "#D9483C", "#7457B8", "#F3F5FB", "#E07B1A", "#0F9AD6", "#C2412D", "#556D31", "#FFC530", "#7457B8", "#D9483C", "#E07B1A", "#2B55C7"];
function wrapRows(text, max = 14) { const rows = []; let r = ""; for (const w of text.split(" ")) { if (!r) r = w; else if ((r + " " + w).length <= max) r += " " + w; else { rows.push(r); r = w; } } if (r) rows.push(r); return rows; }
function wheelPool() {
  const acr = D.ACRONYMS.map(a => ({ cat: `Acronym: ${a[0]}`, text: expansion(a).toUpperCase(), hint: null }));
  const terms = D.GLOSSARY.filter(g => g[3] === 1 && !g[2].includes(",")).map(g => ({ g, t: termBase(g[0]).toUpperCase().replace(/’/g, "'") }))
    .filter(x => /^[A-Z][A-Z '\-&]+$/.test(x.t) && x.t.includes(" ") && x.t.split(" ").every(w => w.length <= 14) && wrapRows(x.t).length <= 4)
    .map(x => ({ cat: `Key term · ${UNITS[x.g[2]].short}`, text: x.t, hint: maskDef(x.g) }));
  const a = shuffle(acr).slice(0, 10), t = shuffle(terms).slice(0, 10), out = [];
  for (let i = 0; i < 10; i++) { if (t[i]) out.push(t[i]); if (a[i]) out.push(a[i]); }
  return out;
}
let W = null;
function newWheel() { W = { pool: wheelPool(), i: 0, rot: 0, spinning: false, value: null, banks: S.teams.map(() => 0), msg: "Spin the wheel to start.", res: "", hint: false, solved: false }; resetPuzzle(); }
function resetPuzzle() { W.used = new Set(); W.solved = false; W.value = null; W.hint = false; W.banks = S.teams.map(() => 0); W.res = ""; W.fresh = new Set(); W.msg = "Spin the wheel to start."; }
function playWheel(box) {
  if (!W || W.banks.length !== S.teams.length) newWheel();
  let raf = null;
  const P = () => W.pool[W.i];
  const isLetter = c => /[A-Z]/.test(c);
  const remaining = () => [...P().text].some(c => isLetter(c) && !W.used.has(c));
  const render = () => {
    const p = P();
    const rows = wrapRows(p.text);
    box.innerHTML = `<div class="wheel">
      <div class="wcan"><div class="pointer"></div><canvas id="wc" width="840" height="840" aria-label="Prize wheel"></canvas><div class="wres" aria-live="polite">${esc(W.res)}</div>
        <div class="row" style="justify-content:center"><button class="btn go" type="button" data-a="spin" ${W.spinning || W.solved || W.value !== null ? "disabled" : ""}>Spin <span class="kbd" style="color:inherit;border-color:currentColor">Space</span></button></div></div>
      <div style="display:grid;gap:12px;min-width:0">
        <div class="row" style="justify-content:space-between"><span class="tip">Puzzle ${W.i + 1} of ${W.pool.length} · Turn: <b class="curname"></b></span>
          <span class="row"><button class="btn ghost" type="button" data-a="skip">Skip puzzle</button></span></div>
        <div class="wboard"><div class="wcat">${esc(p.cat)}</div>
          ${rows.map(r => `<div class="wrow">${[...r].map(c => c === " " ? `<span class="wt s"></span>` : isLetter(c) ? `<span class="wt l ${W.used.has(c) || W.solved ? "" : "hid"} ${W.fresh.has(c) ? "new" : ""}">${c}</span>` : `<span class="wt l">${esc(c)}</span>`).join("")}</div>`).join("")}
        </div>
        ${W.hint && p.hint ? `<p class="mexp">${esc(p.hint)}</p>` : ""}
        <div class="wmsg" aria-live="polite">${W.msg}</div>
        <div class="keys" aria-label="Letters">${"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(L => { const v = "AEIOU".includes(L); const dis = W.solved || W.spinning || W.used.has(L) || (!v && W.value === null) || (v && W.value !== null); return `<button class="key ${v ? "v" : ""}" type="button" data-l="${L}" ${dis ? "disabled" : ""} aria-label="${v ? "Buy vowel " : ""}${L}">${L}</button>`; }).join("")}</div>
        <div class="banks">${S.teams.map((t, i) => `<span class="${i === S.cur ? "cur" : ""}"><span data-tname="${i}">${esc(t.name)}</span> <b>${W.banks[i]}</b></span>`).join("")}</div>
        <div class="row">
          <button class="btn ok" type="button" data-a="solve" ${W.solved ? "disabled" : ""}>Solved ✓</button>
          <button class="btn no" type="button" data-a="miss" ${W.solved ? "disabled" : ""}>Wrong solve ✕</button>
          ${p.hint ? `<button class="btn ghost" type="button" data-a="hint" ${W.hint ? "disabled" : ""}>Hint</button>` : ""}
          <span class="sp"></span>
          <button class="btn go" type="button" data-a="nextp">${W.i === W.pool.length - 1 ? "Back to the menu" : "Next puzzle ▶"}</button>
        </div>
      </div></div>`;
    W.fresh = new Set();
    draw();
    refreshNames();
  };
  const draw = () => {
    const c = box.querySelector("#wc"); if (!c) return;
    const x = c.getContext("2d"), R = 410, n = WEDGES.length, seg = Math.PI * 2 / n;
    x.clearRect(0, 0, 840, 840); x.save(); x.translate(420, 420);
    for (let i = 0; i < n; i++) {
      const a0 = W.rot + i * seg;
      x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R, a0, a0 + seg); x.closePath();
      x.fillStyle = WCOL[i]; x.fill(); x.strokeStyle = "#0A1022"; x.lineWidth = 4; x.stroke();
      x.save(); x.rotate(a0 + seg / 2);
      const dark = ["#FFC530", "#F3F5FB"].includes(WCOL[i]);
      x.fillStyle = dark ? "#111111" : "#FFFFFF"; x.textAlign = "right"; x.textBaseline = "middle";
      const label = String(WEDGES[i]);
      x.font = `900 ${typeof WEDGES[i] === "number" ? 58 : 34}px "Big Shoulders Display", Impact, sans-serif`;
      x.fillText(label, R - 26, 0); x.restore();
    }
    x.beginPath(); x.arc(0, 0, 58, 0, Math.PI * 2); x.fillStyle = "#182036"; x.fill(); x.lineWidth = 8; x.strokeStyle = "#FFC530"; x.stroke();
    x.restore();
  };
  const spin = () => {
    if (W.spinning || W.solved || W.value !== null) return;
    W.spinning = true; W.res = ""; render();
    const start = W.rot, extra = Math.PI * 2 * (4 + Math.random() * 3) + Math.random() * Math.PI * 2;
    const dur = reduceMotion ? 400 : 4200, t0 = performance.now();
    const seg = Math.PI * 2 / WEDGES.length; let lastIdx = -1;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      W.rot = start + extra * e; draw();
      const idx = Math.floor(W.rot / seg); if (idx !== lastIdx) { lastIdx = idx; sfx.tick(); }
      if (p < 1) raf = requestAnimationFrame(step); else land();
    };
    raf = requestAnimationFrame(step);
  };
  const land = () => {
    const n = WEDGES.length, seg = Math.PI * 2 / n;
    let a = (Math.PI * 1.5 - W.rot) % (Math.PI * 2); if (a < 0) a += Math.PI * 2;
    const w = WEDGES[Math.floor(a / seg) % n];
    W.spinning = false;
    if (w === "BANKRUPT") { W.res = "Bankrupt!"; W.msg = `${esc(S.teams[S.cur].name)} loses their round bank. Next team.`; W.banks[S.cur] = 0; sfx.wrong(); nextTeamQuiet(); }
    else if (w === "LOSE A TURN") { W.res = "Lose a turn"; W.msg = "Play passes to the next team."; sfx.wrong(); nextTeamQuiet(); }
    else { W.value = w; W.res = `${w} points`; W.msg = `Call a consonant for ${w} points each.`; sfx.reveal(); }
    render();
  };
  const nextTeamQuiet = () => { S.onTurn = null; nextTeam(); S.onTurn = render; };
  const guess = L => {
    if (W.solved || W.spinning || W.used.has(L)) return;
    const vowel = "AEIOU".includes(L);
    if (vowel) {
      if (W.value !== null) return;
      if (W.banks[S.cur] < 25) { W.msg = `A vowel costs 25. ${esc(S.teams[S.cur].name)} needs 25 in their round bank.`; render(); return; }
      W.banks[S.cur] -= 25;
    } else if (W.value === null) return;
    W.used.add(L);
    const n = [...P().text].filter(c => c === L).length;
    if (n) {
      W.fresh.add(L);
      if (!vowel) W.banks[S.cur] += W.value * n;
      W.msg = `There ${n === 1 ? "is one" : "are " + n} ${L}${n === 1 ? "" : "'s"}${vowel ? "" : `: +${W.value * n}`}. Spin again, buy a vowel or solve.`;
      sfx.right();
      if (!remaining()) W.msg += " Every letter is showing, so solve it!";
    } else { W.msg = `No ${L}. Play passes to the next team.`; sfx.wrong(); nextTeamQuiet(); }
    W.value = null; render();
  };
  box.onclick = e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.dataset.l) { guess(b.dataset.l); return; }
    const a = b.dataset.a;
    if (a === "spin") spin();
    if (a === "hint") { W.hint = true; render(); }
    if (a === "solve") { const pts = Math.max(W.banks[S.cur], 50); W.solved = true; W.msg = `Solved by ${esc(S.teams[S.cur].name)}! ${pts} points banked${W.banks[S.cur] < 50 ? " (50-point minimum)" : ""}.`; award(S.cur, pts); sfx.win(); render(); }
    if (a === "miss") { W.msg = "Not quite. Play passes to the next team."; W.value = null; sfx.wrong(); nextTeamQuiet(); render(); }
    if (a === "skip" || a === "nextp") {
      if (a === "nextp" && W.i === W.pool.length - 1) { go(0); return; }
      W.i = (W.i + 1) % W.pool.length; resetPuzzle(); render();
    }
  };
  S.onKey = k => {
    if (k === " ") { spin(); return true; }
    if (/^[a-zA-Z]$/.test(k)) { guess(k.toUpperCase()); return true; }
    return false;
  };
  S.onTurn = render;
  S.cleanup = () => cancelAnimationFrame(raf);
  render();
  playBed("wheel");

}

/* ---------- Heads Up ---------- */

  decks.push({ id: "acr", name: "Acronyms", c: "var(--gold)", cards: D.ACRONYMS.map(a => ({ t: a[0], d: titleCase(expansion(a)), u: null })) });
  decks.push({ id: "mix", name: "Mixed bag", c: "var(--ink)", cards: [].concat(...decks.map(d => d.cards)) });
  HU = { decks, deck: "mix", used: new Set() };
