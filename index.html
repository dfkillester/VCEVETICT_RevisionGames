          : `<p class="eyebrow">Deck: ${esc(D0.name)}</p><p class="hterm" style="font-size:clamp(2rem,6vw,4rem)">Guesser, turn your back to the screen!</p><p class="hdef"><b class="curname"></b> is up. Start the clock when you're ready.</p>`}
      </div>
      <div class="row" style="justify-content:center">${st.run ? `<button class="btn ok big" type="button" data-a="ok">Correct <span class="kbd" style="color:inherit;border-color:currentColor">C</span></button><button class="btn pass big" type="button" data-a="pass">Pass <span class="kbd" style="color:inherit;border-color:currentColor">P</span></button>`
        : `<button class="btn go big" type="button" data-a="start">Start the clock</button>`}</div>
      <p class="tip" style="text-align:center">${st.run ? `✓ ${st.log.filter(x => x.ok).length} · Pass ${st.log.filter(x => !x.ok).length}` : "Cards don't repeat between rounds."}</p>`;
    refreshNames();
  };
  const flash = ok => {
    const f = document.createElement("div"); f.className = "hflash " + (ok ? "ok" : "pass"); f.innerHTML = `<span>${ok ? "Correct!" : "Pass"}</span>`;
    document.body.appendChild(f); setTimeout(() => f.remove(), 550);
  };
  const start = () => {
    if (st.run || st.done) return;
    let pool = deck().cards.filter(c => !HU.used.has(c.t));
    if (pool.length < 25) { deck().cards.forEach(c => HU.used.delete(c.t)); pool = deck().cards.slice(); }
    st.q = shuffle(pool); st.i = 0; st.run = true;
    playMusic("headsBeat", { loop: true, vol: .4 });
    st.iv = setInterval(() => { st.t--; if (st.t <= 5 && st.t > 0) sfx.tick(); if (st.t <= 0) finish(); else { const el = box.querySelector(".hclock"); if (el) { el.textContent = st.t; el.classList.toggle("low", st.t <= 10); } } }, 1000);
    render();
  };
  const mark = ok => {
    if (!st.run) return;
    const c = card(); HU.used.add(c.t); st.log.push({ t: c.t, ok });
    ok ? sfx.right() : tone(330, .15, "triangle", .1); flash(ok);
    st.i++; if (st.i >= st.q.length) { st.q = st.q.concat(shuffle(deck().cards)); }
    render();
  };
  const finish = () => { stopMusic(); clearInterval(st.iv); st.run = false; st.done = true; award(S.cur, st.log.filter(x => x.ok).length * 20); sfx.win(); render(); };
  box.onclick = e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.dataset.deck) { HU.deck = b.dataset.deck; render(); return; }
    const a = b.dataset.a;
    if (a === "start") start();
    if (a === "ok") mark(true);
    if (a === "pass") mark(false);
    if (a === "nextteam") { nextTeam(); st = { t: 60, run: false, done: false, q: [], i: 0, log: [], iv: null }; render(); }
    if (a === "next") go(0);
  };
  S.onKey = k => {
    const K = k.toLowerCase();
    if (k === " " && !st.run && !st.done) { start(); return true; }
    if (K === "c") { mark(true); return true; }
    if (K === "p" || K === "x") { mark(false); return true; }
    return false;
  };
  S.onTurn = () => { if (!st.run) render(); };
  S.cleanup = () => { clearInterval(st.iv); stopMusic(); };
  render();
}

/* ---------- 5. The Chase ---------- */
let CH = null;
function chasePool() {
  const a = D.ACRONYMS.map(x => ({ q: `What does ${x[0]} stand for?`, a: titleCase(expansion(x)) }));
  const g = D.GLOSSARY.filter(x => x[1].length < 120 && !["Policy", "Client (internal/external)", "802.11"].includes(x[0])).map(x => ({ q: `Name the term: ${maskDef(x)}`, a: x[0], u: x[2] }));
  return shuffle(a.concat(shuffle(g).slice(0, 70)));
}
function playChase(box) {
  if (!CH) CH = { pool: chasePool(), p: 0 };
  let st = { t: 60, run: false, done: false, r: 0, w: 0, last: null, iv: null };
  const C = 2 * Math.PI * 92;
  const q = () => CH.pool[CH.p % CH.pool.length];
  const render = () => {
    box.innerHTML = `<div class="chase">
      <div style="display:grid;gap:14px">
        <div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="var(--panel-2)" stroke-width="12"/><circle cx="100" cy="100" r="92" fill="none" stroke="${st.t <= 10 ? "var(--bad)" : "var(--blue)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - st.t / 60)}"/></svg><div class="num" aria-live="off">${st.t}</div></div>
        <div class="tally"><span class="r">✓ ${st.r}</span><span class="w">✕ ${st.w}</span></div>
        <p class="tip" style="text-align:center">On the clock: <b class="curname"></b></p>
      </div>
      <div style="display:grid;gap:14px;min-width:0">
        ${st.done ? `<div class="done-card"><p class="eyebrow">Time!</p><b>${st.r} correct</b><p><span class="curname"></span> banks ${st.r * 20} points.</p>
            <div class="row" style="justify-content:center"><button class="btn go" type="button" data-a="nextteam">Next team's turn</button><button class="btn" type="button" data-a="next">Back to the menu</button></div></div>`
          : `<div class="cq">${st.run ? esc(q().q) : "Ready? 60 seconds on the clock."}</div>
            <div class="row" style="justify-content:center">${st.run ? `<button class="btn ok" type="button" data-a="ok">Correct <span class="kbd" style="color:inherit;border-color:currentColor">C</span></button><button class="btn no" type="button" data-a="no">Wrong / pass <span class="kbd" style="color:inherit;border-color:currentColor">X</span></button>` : `<button class="btn go" type="button" data-a="start">Start the clock</button>`}</div>`}
        ${st.last ? `<p class="clast">${st.last.ok ? "✓" : "✕"} ${esc(st.last.q)} <b>${esc(st.last.a)}</b></p>` : ""}
      </div></div>`;
    refreshNames();
  };
  const finish = () => { stopMusic(); clearInterval(st.iv); st.run = false; st.done = true; award(S.cur, st.r * 20); sfx.win(); render(); };
  const mark = ok => { if (!st.run) return; const x = q(); st.last = { q: x.q, a: x.a, ok }; ok ? (st.r++, sfx.right()) : (st.w++, sfx.wrong()); CH.p++; render(); };
  box.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const a = b.dataset.a;
    if (a === "start") { playMusic("pulse", { loop: true, vol: .5 }); st.run = true; st.iv = setInterval(() => { st.t--; if (st.t <= 5 && st.t > 0) sfx.tick(); if (st.t <= 0) finish(); else render(); }, 1000); render(); }
    if (a === "ok") mark(true);
    if (a === "no") mark(false);
    if (a === "nextteam") { nextTeam(); st = { t: 60, run: false, done: false, r: 0, w: 0, last: null, iv: null }; render(); }
    if (a === "next") go(0);
  };
  S.onKey = k => { const K = k.toLowerCase(); if (K === "c") { mark(true); return true; } if (K === "x") { mark(false); return true; } return false; };
  S.cleanup = () => { clearInterval(st.iv); stopMusic(); };
  render();
}

/* ---------- Champions ---------- */
function renderChamps(box) {
  const ranked = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score);
  const order = ranked.length >= 3 ? [ranked[1], ranked[0], ranked[2]] : ranked.length === 2 ? [ranked[1], ranked[0]] : ranked;
  const h = { 0: 100, 1: 72, 2: 52 };
  box.innerHTML = `<div style="text-align:center;display:grid;gap:8px"><p class="eyebrow">And the winner is…</p><h1 class="marquee" style="font-size:clamp(2.6rem,8vw,6rem)"><b>${esc(ranked[0].name)}</b></h1><p class="tip">${ranked[0].score} points · good luck in the exam, everyone</p></div>
    <div class="podium">${order.map(t => { const place = ranked.indexOf(t); return `<div class="pod p${place + 1}"><span class="nm">${esc(t.name)}</span><span class="pv">${t.score} pts</span><div class="blk" style="height:${h[place] * 2.4}px">${place + 1}</div></div>`; }).join("")}</div>
    ${ranked.length > 3 ? `<p class="tip" style="text-align:center">${ranked.slice(3).map((t, k) => `${k + 4}. ${esc(t.name)}: ${t.score}`).join(" · ")}</p>` : ""}
    <div class="row" style="justify-content:center"><button class="btn go" type="button" id="cf">Confetti!</button>${S.returnTo != null ? `<button class="btn ghost" type="button" id="back2">Oops, back to the game</button>` : ""}<button class="btn ghost" type="button" id="home2">Back to the menu</button></div>`;
  box.querySelector("#home2").onclick = () => { S.returnTo = null; go(0); };
  const bk = box.querySelector("#back2"); if (bk) bk.onclick = () => { const r = S.returnTo; S.returnTo = null; go(r); };
  box.querySelector("#cf").onclick = () => { confetti(); playMusic("champs"); };
  if (S.music) playMusic("champs"); else sfx.win();
  confetti();
}
function confetti() {
  if (reduceMotion) return;
  let c = $("#confetti"); if (!c) { c = document.createElement("canvas"); c.id = "confetti"; document.body.appendChild(c); }
  const x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#FFC530", "#0F9AD6", "#556D31", "#7457B8", "#D9483C"];
  const ps = Array.from({ length: 180 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6, s: 5 + Math.random() * 7, c: cols[Math.random() * 5 | 0] }));
  let n = 0;
  const step = () => {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++n < 260) requestAnimationFrame(step); else x.clearRect(0, 0, c.width, c.height);
  };
  step();
}

/* ---------- Global controls ---------- */
$("#prevBtn").onclick = () => go(S.slide - 1);
$("#nextBtn").onclick = () => go(S.slide + 1);
$("#homeBtn").onclick = () => { S.returnTo = null; go(0); };
$("#endBtn").onclick = () => { if (S.slide !== SLIDES.length - 1) S.returnTo = S.slide; go(SLIDES.length - 1); };
$("#fsBtn").onclick = () => { try { const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => toast("Full screen isn't available here")); } catch (e) { toast("Full screen isn't available here"); } };
$("#soundBtn").onclick = e => { S.sound = !S.sound; e.currentTarget.setAttribute("aria-pressed", S.sound); e.currentTarget.textContent = S.sound ? "Effects on" : "Effects off"; if (S.sound) sfx.reveal(); };
function setMusic(on) { S.music = on; store.set("music", on); const b = $("#musicBtn"); b.setAttribute("aria-pressed", on); b.textContent = on ? "♪ Music on" : "♪ Music off"; if (!on) stopMusic(); }
function slideMusic() { const sl = SLIDES[S.slide]; if (sl.k === "play") { if (BEDS[sl.g.id]) playBed(sl.g.id); } else playMusic(sl.k === "title" ? sl.g.id : sl.k === "champs" ? "champs" : "show"); }
$("#musicBtn").onclick = () => { setMusic(!S.music); if (S.music) slideMusic(); };
/* Browsers only allow sound after the first click or key press, so music starts then */
function unlockAudio(e) {
  if (S.unlocked) return;
  S.unlocked = true;
  try { actx(); } catch (err) {}
  document.removeEventListener("pointerdown", unlockAudio, true);
  document.removeEventListener("keydown", unlockAudio, true);
  if (e && e.target && e.target.closest && e.target.closest("#musicBtn")) return;
  if (S.music) slideMusic();
}
document.addEventListener("pointerdown", unlockAudio, true);
document.addEventListener("keydown", unlockAudio, true);
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($("#modal")) { if (e.key === "Escape") closeModal(); return; }
  if (S.onKey && S.onKey(e.key)) { e.preventDefault(); return; }
  if (["ArrowRight", "PageDown"].includes(e.key)) { e.preventDefault(); go(S.slide + 1); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(S.slide - 1); }
});

function start(data) {
  S.teams = (data && data.teams) || store.get("teams", null) || makeTeams(4);
  S.cur = (data && data.cur) ?? store.get("cur", 0); if (S.cur >= S.teams.length) S.cur = 0;
  renderScore();
  setMusic(S.music);
  go((data && data.slide) ?? 0);
}
window.claude?.hot?.snapshot?.(() => ({ teams: S.teams, cur: S.cur, slide: S.slide }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
